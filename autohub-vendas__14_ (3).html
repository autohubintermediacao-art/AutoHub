<style>
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--blue-dark:#1D4ED8;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --orange:#EA580C;--orange-bg:#FFF7ED;--orange-border:#FED7AA;
  --teal:#0D9488;--teal-bg:#F0FDFA;--teal-border:#99F6E4;
  --gray-bg:#F3F4F6;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;width:100%;text-align:left;transition:all .12s;font-family:inherit;white-space:nowrap}
.nav-btn:hover{background:var(--blue-light);color:var(--blue)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-user{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue-dark);flex-shrink:0}
/* METRIC CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:20px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.mc-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px}
.mc-value{font-size:21px;font-weight:700;letter-spacing:-.5px}
.mc-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* SECTION CARD */
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.sc-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sc-title{font-size:14px;font-weight:600}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.by{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.bb{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid)}
.bp{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.bo{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.bt{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
.bgr{background:var(--gray-bg);color:var(--text2);border:1px solid var(--border)}
/* PIPELINE BADGES */
.pip-agu-boleto{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-boleto-pago{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-agu-lib{background:#EDE9FE;color:#5B21B6;border:1px solid #DDD6FE;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-liberado{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
/* BTNS */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{opacity:.88}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-s{background:var(--white);color:var(--text);border-color:var(--border2)}
.btn-s:hover{background:var(--gray-bg)}
.btn-d{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-g{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-y{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.bico{padding:5px 7px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;line-height:1}
.bico:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}
/* FILTER TABS */
.ftab{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;font-family:inherit}
.ftab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* SEARCH */
.sw{position:relative}
.sw input{padding-left:32px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
/* STATUS SELECT INLINE */
.status-sel{border:1px solid var(--border);border-radius:99px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:none;font-family:inherit;background:var(--white);transition:all .15s}
.status-pago,.status-recebido{background:var(--green-bg)!important;color:var(--green)!important;border-color:var(--green-border)!important}
.status-pendente,.status-atrasado{background:var(--yellow-bg)!important;color:var(--yellow)!important;border-color:var(--yellow-border)!important}
.status-cancelado{background:var(--gray-bg)!important;color:var(--text2)!important;border-color:var(--border)!important}
/* FORM */
input,select,textarea{background:var(--white);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column}
.fi.full{grid-column:1/-1}
.fsec{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;grid-column:1/-1;margin-top:4px}
/* TIPO RECEITA/DESPESA TOGGLE */
.tipo-toggle{display:flex;gap:0;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.tipo-btn{flex:1;padding:9px 12px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .12s;background:var(--white);color:var(--text2)}
.tipo-btn.active-rec{background:var(--green-bg);color:var(--green);font-weight:700}
.tipo-btn.active-des{background:var(--red-bg);color:var(--red);font-weight:700}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.mt{font-size:15px;font-weight:700}
.mc2{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px;border-radius:4px}
.mc2:hover{background:var(--gray-bg)}
.mb{padding:20px}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
/* NOTIFY */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-weight:500;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:320px;box-shadow:var(--shadow-md)}
#notif.show{opacity:1}
#notif.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#notif.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
/* LOGIN */
.ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.lb{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.li{width:60px;height:60px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 12px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.lf input{font-size:14px;padding:11px 14px}
.lbtn{width:100%;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.lerr{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}
/* CONFIRM */
.co{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500}
.cb{background:var(--white);border-radius:var(--radius-lg);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow-md)}
/* DRE */
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:3px}
.dre-group{font-weight:700;background:var(--blue-light);color:var(--blue-dark);margin-top:10px}
.dre-total{font-weight:700;font-size:15px;background:var(--green-bg);color:var(--green);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-neg{font-weight:700;font-size:15px;background:var(--red-bg);color:var(--red);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-sub{color:var(--text2)}
/* REL TABS */
.rel-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);overflow-x:auto}
.rel-tab{padding:10px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit;white-space:nowrap}
/* TOTALS BAR */
.tbar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap}
.ti{display:flex;flex-direction:column;gap:2px}
.tl{font-size:11px;color:var(--text2);font-weight:500}
.tv{font-size:16px;font-weight:700}
/* DETAIL ROW */
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border-bottom:none}
/* VENC COLORS */
.venc-ok{color:var(--green)}
.venc-hj{color:var(--yellow);font-weight:600}
.venc-atrasado{color:var(--red);font-weight:600}
/* CONFIG */
.cfg-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--white)}
/* DOSSIÊ */
.dos-block{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* PRINT */
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{display:block!important}
  #content{overflow:visible!important;padding:0!important}
  .sc{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  body{background:#fff!important;font-size:12px}
  .btn,.bico,.ftab{display:none!important}
  .sc-header .btn,.sc-header .bico{display:none!important}
  table{font-size:11px}
  th,td{padding:7px 10px!important}
  .print-header{display:block!important}
}
.print-header{display:none;text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #333}
@media(max-width:640px){#sidebar{position:fixed;height:100vh;z-index:100}.fg{grid-template-columns:1fr}.cards-row{grid-template-columns:1fr 1fr}}
</style>
</head>

// EXCEL EXPORT
function exportarExcel(dados,nomeArquivo,nomeAba){
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(dados);
  var cols=[];
  dados[0].forEach(function(_,i){var max=10;dados.forEach(function(r){var v=String(r[i]||"");if(v.length>max)max=v.length;});cols.push({wch:Math.min(max+2,40)});});
  ws["!cols"]=cols;
  XLSX.utils.book_append_sheet(wb,ws,nomeAba||"Dados");
  XLSX.writeFile(wb,nomeArquivo+".xlsx");
  notify("Excel exportado!");
}

// FIREBASE
function initFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.firestore();
  col("vendas").orderBy("dataCriacao","desc").onSnapshot(function(s){vendas=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","vendas","relatorios","metas"]);});
  col("lancamentos").orderBy("data","desc").onSnapshot(function(s){lancamentos=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","financeiro","relatorios","metas"]);});
  col("contasPagar").orderBy("vencimento","asc").onSnapshot(function(s){contasPagar=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","cxpagar","relatorios","metas"]);});
  col("contasReceber").orderBy("vencimento","asc").onSnapshot(function(s){contasReceber=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","cxreceber","relatorios","metas"]);});
  col("posvenda").orderBy("dataSolicitacao","desc").onSnapshot(function(s){posvenda=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["posvenda"]);});
  col("clientes").orderBy("nome","asc").onSnapshot(function(s){clientes=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["clientes","vendas"]);});
  col("config").doc("main").onSnapshot(function(s){if(s.exists)cfg=s.data();if(currentTab==="configuracoes")render();});
  col("metas").orderBy("mes","desc").onSnapshot(function(s){metas=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["metas","dashboard"]);});
  db.collection("leads").orderBy("createdAt","desc").onSnapshot(function(s){leads=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["leads","dashboard"]);},function(e){console.log("leads:",e);});
}

// NAV
function buildNav(){
  var nav=document.getElementById("nav");nav.innerHTML="";
  TABS.forEach(function(t){
    if(!hasTab(t.id))return;
    var b=document.createElement("button");
    b.className="nav-btn"+(currentTab===t.id?" active":"");
    b.innerHTML='<span style="font-size:15px">'+t.ico+'</span><span>'+t.label+'</span>';
    b.onclick=function(){navigateTo(t.id);};
    nav.appendChild(b);
  });
}
function navigateTo(id){
  if(!hasTab(id))return;
  currentTab=id;
  document.getElementById("pageTitle").textContent=(TABS.find(function(x){return x.id===id;})||{label:""}).label;
  buildNav();render();
}

function renderDash(){
  var ativas=vendas.filter(function(v){return v.statusVenda!=="Cancelada";});
  var volV=ativas.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var volC=ativas.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var margem=volV-volC;
  var crPend=contasReceber.filter(function(x){return x.status==="Pendente";});
  var crVal=crPend.reduce(function(a,x){return a+Number(x.valor||0);},0);
  // CP só conta no dashboard se a venda tiver CR recebido (ou se não tiver vendaId)
  var crRecebidoIds={};contasReceber.forEach(function(cr){if(cr.vendaId&&cr.status==="Recebido")crRecebidoIds[cr.vendaId]=true;});
  var cpPend=contasPagar.filter(function(x){return x.status==="Pendente"&&(!x.vendaId||crRecebidoIds[x.vendaId]);});
  var cpVal=cpPend.reduce(function(a,x){return a+Number(x.valor||0);},0);
  var crAtras=crPend.filter(function(x){return x.vencimento&&x.vencimento<today();}).length;
  var cpAtras=cpPend.filter(function(x){return x.vencimento&&x.vencimento<today();}).length;
  var d7=new Date();d7.setDate(d7.getDate()+7);var d7s=d7.toISOString().split("T")[0];
  var entra=crPend.filter(function(x){return x.vencimento>=today()&&x.vencimento<=d7s;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var sai=cpPend.filter(function(x){return x.vencimento>=today()&&x.vencimento<=d7s;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var libPend=vendas.filter(function(v){return v.pipelineStage&&v.pipelineStage!=="Liberado"&&v.statusVenda!=="Cancelada";}).length;

  var h='<div class="cards-row">';
  h+='<div class="mc"><div class="mc-label">Margem Total</div><div class="mc-value" style="color:var(--green);font-size:17px">'+fmtCur(margem)+'</div><div class="mc-sub">'+ativas.length+' veículos</div></div>';
  h+='<div class="mc"><div class="mc-label">A Receber</div><div class="mc-value" style="color:var(--blue);font-size:17px">'+fmtCur(crVal)+'</div><div class="mc-sub">'+(crAtras?'<span style="color:var(--red)">'+crAtras+' atrasados</span>':crPend.length+' pendentes')+'</div></div>';

  h+='<div class="mc"><div class="mc-label">Entra (7 dias)</div><div class="mc-value" style="color:var(--green);font-size:17px">'+fmtCur(entra)+'</div><div class="mc-sub">Próximos 7 dias</div></div>';
  h+='<div class="mc"><div class="mc-label">Sai (7 dias)</div><div class="mc-value" style="color:var(--red);font-size:17px">'+fmtCur(sai)+'</div><div class="mc-sub">Próximos 7 dias</div></div>';
  h+='<div class="mc"><div class="mc-label">Aguardando Liberação</div><div class="mc-value" style="color:var(--purple)">'+libPend+'</div><div class="mc-sub">No pipeline</div></div>';
  h+='</div>';

  // Alertas
  var alerts=[];
  crPend.filter(function(x){return x.vencimento&&x.vencimento<today();}).forEach(function(x){alerts.push('<span style="color:var(--red)">📥 A Receber atrasado:</span> '+escH(x.descricao||"")+" — "+fmtCur(x.valor)+" (venc. "+fmtDate(x.vencimento)+")");});
  cpPend.filter(function(x){return x.vencimento&&x.vencimento<today();}).forEach(function(x){alerts.push('<span style="color:var(--red)">📤 A Pagar atrasado:</span> '+escH(x.descricao||"")+" — "+fmtCur(x.valor)+" (venc. "+fmtDate(x.vencimento)+")");});
  if(alerts.length){
    h+='<div class="sc"><div class="sc-header" style="background:var(--red-bg)"><span class="sc-title" style="color:var(--red)">⚠️ Alertas ('+alerts.length+')</span></div><div style="padding:12px 16px">';
    alerts.forEach(function(a){h+='<div style="padding:8px 12px;border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:6px;font-size:13px">'+a+'</div>';});
    h+='</div></div>';
  }

  // Pipeline resumo
  var pipCount={};PIPELINE_STAGES.forEach(function(s){pipCount[s]=0;});
  vendas.filter(function(v){return v.statusVenda!=="Cancelada";}).forEach(function(v){var s=v.pipelineStage||"Aguardando Boleto";if(pipCount[s]!==undefined)pipCount[s]++;});

  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--border)">';

  var pipBgs=["#FEF3C7","#DBEAFE","#EDE9FE","#D1FAE5"];

  });
  h+='</div></div>';

  h+='<div class="sc"><div class="sc-header"><span class="sc-title">Últimas Vendas</span><button class="btn btn-s btn-sm" onclick="navigateTo(\'vendas\')">Ver todas →</button></div>';

  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comprador</th><th>Margem</th><th>Pipeline</th><th>Status</th></tr></thead><tbody>';

    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

// ── Aba de acompanhamento de Taxas de Plataforma ──
function renderTaxasPlataforma(){
  // Coletar todas as taxas das vendas
  var todasTaxas=vendas.filter(function(v){return v.taxaCanal&&Number(v.taxaCanal)>0;}).map(function(v){
    var cpVinc=contasPagar.filter(function(x){return x.vendaId===v.id&&x.categoria==="taxa_canal"&&x.status!=="Cancelado";});
    // Se tem campo taxaResponsavel usa ele, senão infere: se tem CP ativo = Auto Hub, se não tem = Comprador
    var responsavel=v.taxaResponsavel||(cpVinc.length>0?"Auto Hub":"Comprador");
    var crVinc=contasReceber.filter(function(x){return x.vendaId===v.id&&x.taxaCanal===true;});
    return{
      vendaId:v.id,placa:v.placa,modelo:v.modelo,dataVenda:v.dataVenda,canal:v.canal||"-",
      valor:Number(v.taxaCanal||0),responsavel:responsavel,
      nomeComprador:v.nomeComprador,statusVenda:v.statusVenda,
      cpVinc:cpVinc,crVinc:crVinc,
      taxaStatus:v.taxaStatus||"Pendente"
    };
  });
  var txFiltResp=window._txFiltResp||"Todos";
  var txFiltMes=window._txFiltMes||"";
  var lista=todasTaxas.filter(function(t){
    var ok=txFiltResp==="Todos"||t.responsavel===txFiltResp;
    if(txFiltMes)ok=ok&&(t.dataVenda||"").slice(0,7)===txFiltMes;
    return ok;
  });
  var totalHub=lista.filter(function(t){return t.responsavel==="Auto Hub";}).reduce(function(a,t){return a+t.valor;},0);
  var totalComp=lista.filter(function(t){return t.responsavel==="Comprador";}).reduce(function(a,t){return a+t.valor;},0);
  var meses=vendas.map(function(v){return(v.dataVenda||"").slice(0,7);}).filter(function(m,i,a){return m&&a.indexOf(m)===i;}).sort().reverse();

  var h='<div class="sc"><div class="sc-header" style="background:var(--teal-bg)"><span class="sc-title" style="color:var(--teal)">💳 Acompanhamento de Taxas de Plataforma</span></div>';
  h+='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
  h+='<select onchange="window._txFiltResp=this.value;render()" style="width:auto;min-width:160px"><option value="Todos">Todos os responsáveis</option><option value="Auto Hub"'+(txFiltResp==="Auto Hub"?" selected":"")+'>Auto Hub</option><option value="Comprador"'+(txFiltResp==="Comprador"?" selected":"")+'>Comprador</option></select>';
  h+='<select onchange="window._txFiltMes=this.value;render()" style="width:auto;min-width:130px"><option value="">Todos os meses</option>'+meses.map(function(m){return'<option value="'+m+'"'+(txFiltMes===m?" selected":"")+'>'+fmtMes(m)+'</option>';}).join('')+'</select>';
  h+='</div>';
  h+='<div class="tbar">';
  h+='<div class="ti"><div class="tl">Total taxas</div><div class="tv">'+lista.length+'</div></div>';
  h+='<div class="ti"><div class="tl">Pago pela Auto Hub</div><div class="tv" style="color:var(--red)">'+fmtCur(totalHub)+'</div></div>';
  h+='<div class="ti"><div class="tl">Repassado ao Comprador</div><div class="tv" style="color:var(--teal)">'+fmtCur(totalComp)+'</div></div>';
  h+='<div class="ti"><div class="tl">Total Geral</div><div class="tv">'+fmtCur(totalHub+totalComp)+'</div></div>';
  h+='</div>';
  if(!lista.length){h+='<div class="empty">Nenhuma taxa registrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comprador</th><th>Canal</th><th>Data</th><th>Valor Taxa</th><th>Responsável</th><th>Status</th></tr></thead><tbody>';
    lista.forEach(function(t){
      var statusHtml="";
      if(t.responsavel==="Auto Hub"){
        // Status vem do CP vinculado
        if(t.cpVinc.length>0){
          var cpStatus=t.cpVinc[0].status||"Pendente";
          var cpId=t.cpVinc[0].id;
          statusHtml='<select class="status-sel status-'+cpStatus.toLowerCase()+'" onchange="atualizarStatusCx(\'contasPagar\',\''+cpId+'\',this.value);this.className=\'status-sel status-\'+this.value.toLowerCase()">';
          ["Pendente","Pago","Cancelado"].forEach(function(s){statusHtml+='<option value="'+s+'"'+(cpStatus===s?" selected":"")+'>'+s+'</option>';});
          statusHtml+='</select>';
        } else {
          statusHtml='<span class="badge bgr">Sem CP</span>';
        }
      } else {
        // Comprador: status salvo direto na venda (taxaStatus)
        var ts=t.taxaStatus||"Pendente";
        statusHtml='<select class="status-sel status-'+ts.toLowerCase()+'" onchange="atualizarTaxaComprador(\''+t.vendaId+'\',this.value);this.className=\'status-sel status-\'+this.value.toLowerCase()">';
        ["Pendente","Pago","Cancelado"].forEach(function(s){statusHtml+='<option value="'+s+'"'+(ts===s?" selected":"")+'>'+s+'</option>';});
        statusHtml+='</select>';
      }
      h+='<tr>';
      h+='<td><strong>'+escH(t.placa||"-")+'</strong></td>';
      h+='<td>'+escH(t.modelo||"-")+'</td>';
      h+='<td>'+escH(t.nomeComprador||"-")+'</td>';
      h+='<td><span class="badge bb">'+escH(t.canal)+'</span></td>';
      h+='<td>'+fmtDate(t.dataVenda)+'</td>';
      h+='<td><strong>'+fmtCur(t.valor)+'</strong></td>';
      h+='<td><span class="badge '+(t.responsavel==="Auto Hub"?"bo":"bt")+'">'+escH(t.responsavel)+'</span></td>';
      h+='<td>'+statusHtml+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

function enviarWhatsApp(id){
  var v=vendas.find(function(x){return x.id===id;});
  if(!v){notify("Venda não encontrada","err");return;}
  var tel=v.telefone||"";
  // Pegar telefone do cliente cadastrado se tiver
  if(v.clienteId){
    var c=clientes.find(function(x){return x.id===v.clienteId;});
    if(c&&c.telefone)tel=c.telefone;
  }
  // Limpar telefone - só números
  tel=tel.replace(/\D/g,"");
  if(!tel){notify("Telefone não cadastrado na venda","err");return;}
  // Garantir código do país
  if(tel.length===10||tel.length===11)tel="55"+tel;
  var link=normalizarLink(v.linkBoleto)||"(link não informado)";
  var msg="Caro "+( v.nomeComprador||"cliente")+", segue boleto referente ao veículo "+(v.modelo||"-")+" placa "+(v.placa||"-")+". Verifique os dados do boleto antes do pagamento. Lembrando que após a baixa do boleto a liberação do veículo é de 3 a 5 dias úteis. Acesse o boleto: "+link;
  var url="https://wa.me/"+tel+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

function preencherDadosCliente(){
  var sel=document.getElementById("v_clienteId");
  if(!sel||!sel.value)return;
  var c=clientes.find(function(x){return x.id===sel.value;});
  if(!c)return;
  var f=function(id,val){var el=document.getElementById(id);if(el&&val)el.value=val;};
  f("v_comprador",c.nome);
  f("v_email",c.email);
  f("v_loja",c.nomeLoja);
  f("v_tel",c.telefone);
  f("v_cpf",c.cpfCnpj);
  // UF
  var uf=document.getElementById("v_uf");
  if(uf&&c.uf)uf.value=c.uf;
}

function normalizarLink(url){
  if(!url||!url.trim())return null;
  var u=url.trim();
  if(u.indexOf('http://')!==0&&u.indexOf('https://')!==0)u='https://'+u;
  return u;
}
function preencherTaxaCanal(){
  var sel=document.getElementById("v_canal"),inp=document.getElementById("v_taxaCanal");
  if(!sel||!inp||inp.value)return;
  var canal=getCanais().find(function(c){return c.nome===sel.value;});

}
function verificarPlacaDuplicada(placa,idAtual){
  var av=document.getElementById("v_placa_aviso");
  if(!av)return;
  var p=(placa||"").toUpperCase().trim();
  if(!p){av.style.display="none";return;}
  // Busca todas as vendas com essa placa, exceto a própria em edição
  var encontradas=vendas.filter(function(v){
    return (v.placa||"").toUpperCase().trim()===p && v.id!==idAtual;
  });
  if(!encontradas.length){av.style.display="none";return;}
  // Monta mensagem para cada ocorrência
  var msgs=encontradas.map(function(v){
    var status=v.statusVenda||"Em Andamento";
    var data=v.dataVenda?fmtDate(v.dataVenda):"data não informada";
    var comprador=v.comprador||"cliente não informado";
    var emoji=status==="Vendido"?"🔴":status==="Cancelado"?"⚠️":"🟡";
    return emoji+" <strong>"+escH(status)+"</strong> em "+data+" — Comprador: <strong>"+escH(comprador)+"</strong>";
  });
  av.innerHTML="⚠️ <strong>Atenção: esta placa já consta no sistema!</strong><br>"+msgs.join("<br>");
  av.style.display="block";
}

function salvarVenda(id){
  var placa=(gv("v_placa")||"").toUpperCase().trim(),modelo=(gv("v_modelo")||"").trim(),comprador=(gv("v_comprador")||"").trim();
  if(!placa||!modelo||!comprador){notify("Preencha Placa, Modelo e Comprador","err");return;}
  var custo=getMV("v_custo"),venda=getMV("v_venda"),margem=venda-custo;
  var data={loja:"AUTO HUB",dataVenda:gv("v_data"),placa:placa,modelo:modelo,fornecedor:gv("v_fornecedor")||null,clienteId:gv("v_clienteId")||null,emailComprador:gv("v_email")||null,linkBoleto:normalizarLink(gv("v_link_boleto")),localVeiculo:gv("v_local"),vendedor:gv("v_vendedor"),valorCusto:custo,valorVenda:venda,statusVenda:gv("v_status"),pipelineStage:gv("v_pipeline"),gerarCr:gv("v_gerarCr"),vencCr:gv("v_vencCr"),nomeComprador:comprador,nomeLoja:gv("v_loja"),uf:gv("v_uf"),telefone:gv("v_tel"),cpfCnpj:gv("v_cpf"),obs:gv("v_obs")};
  var comissaoVendedor=getMV("v_comissaoVendedor")||0;
  var comissaoVal=getMV("v_comissaoVal")||0;
  var taxaCanal=getMV("v_taxaCanal")||0;
  var canal=gv("v_canal")||null;
  var parceiro=gv("v_parceiro")||null;
  var parceiro2=gv("v_parceiro2")||null;var comissaoVal2=getMV("v_comissaoVal2")||0;
  var parceiro3=gv("v_parceiro3")||null;var comissaoVal3=getMV("v_comissaoVal3")||0;
  data.comissaoVendedor=comissaoVendedor;data.vencComVendedor=gv("v_vencComVendedor");
  data.parceiro=parceiro;data.comissaoVal=comissaoVal;data.vencCom=gv("v_vencCom");
  data.parceiro2=parceiro2;data.comissaoVal2=comissaoVal2;data.vencCom2=gv("v_vencCom2");
  data.parceiro3=parceiro3;data.comissaoVal3=comissaoVal3;data.vencCom3=gv("v_vencCom3");
  var taxaResponsavel=gv("v_taxaResponsavel")||"Auto Hub";
  data.canal=canal;data.taxaCanal=taxaCanal;data.vencCanal=gv("v_vencCanal");data.taxaResponsavel=taxaResponsavel;
  // Pipeline Liberado → Concluída
  if(data.pipelineStage==="Liberado")data.statusVenda="Concluída";
  var promise;
  if(id){promise=col("vendas").doc(id).update(data);}
  else{data.dataCriacao=today();promise=col("vendas").add(data);}
  promise.then(function(ref){
    var vid=id||(ref?ref.id:"");
    var promises=[];
    // Gerar CR só na criação
    if(!id&&gv("v_gerarCr")==="Sim"&&margem>0){
      promises.push(col("contasReceber").add({descricao:"Intermediação — "+placa+" "+modelo,placa:placa,valor:margem,vencimento:gv("v_vencCr"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
    }
    // Comissão Vendedor: criar sempre que preenchida (criação ou edição)
    var vendedorSel=gv("v_vendedor")||null;
    if(comissaoVendedor>0&&vendedorSel){
      var cpVendExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.vendedor===vendedorSel;});
      if(cpVendExist.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão Vendedor — "+vendedorSel+" — "+placa,placa:placa,vendedor:vendedorSel,parceiro:vendedorSel,categoria:"comissao",valor:comissaoVendedor,vencimento:gv("v_vencComVendedor"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpVendExist[0].id).update({valor:comissaoVendedor,vencimento:gv("v_vencComVendedor"),vendedor:vendedorSel,parceiro:vendedorSel}));
      }
    }
    // Comissão Parceiros: criar sempre que preenchida (criação ou edição)
    if(comissaoVal>0&&parceiro){
      // Verificar se já existe CP de comissão para essa venda
      var cpExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro;});
      if(cpExist.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro+" — "+placa,placa:placa,parceiro:parceiro,categoria:"comissao",valor:comissaoVal,vencimento:gv("v_vencCom"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        // Atualizar valor se mudou
        promises.push(col("contasPagar").doc(cpExist[0].id).update({valor:comissaoVal,vencimento:gv("v_vencCom"),parceiro:parceiro}));
      }
    }
    // Parceiro 2
    if(comissaoVal2>0&&parceiro2){
      var cpEx2=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro2;});
      if(cpEx2.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro2+" — "+placa,placa:placa,parceiro:parceiro2,categoria:"comissao",valor:comissaoVal2,vencimento:gv("v_vencCom2"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpEx2[0].id).update({valor:comissaoVal2,vencimento:gv("v_vencCom2"),parceiro:parceiro2}));
      }
    }
    // Parceiro 3
    if(comissaoVal3>0&&parceiro3){
      var cpEx3=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro3;});
      if(cpEx3.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro3+" — "+placa,placa:placa,parceiro:parceiro3,categoria:"comissao",valor:comissaoVal3,vencimento:gv("v_vencCom3"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpEx3[0].id).update({valor:comissaoVal3,vencimento:gv("v_vencCom3"),parceiro:parceiro3}));
      }
    }
    // Taxa Canal: só gera CP se responsável for Auto Hub
    if(taxaCanal>0&&canal){
      var cpCanalExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="taxa_canal";});
      if(taxaResponsavel==="Auto Hub"){
        if(cpCanalExist.length===0){
          promises.push(col("contasPagar").add({descricao:"Taxa Canal — "+canal+" — "+placa,placa:placa,categoria:"taxa_canal",canal:canal,valor:taxaCanal,vencimento:gv("v_vencCanal"),status:"Pendente",vendaId:vid,taxaResponsavel:"Auto Hub",dataCriacao:today()}));
        } else if(id){
          promises.push(col("contasPagar").doc(cpCanalExist[0].id).update({valor:taxaCanal,vencimento:gv("v_vencCanal"),canal:canal,taxaResponsavel:"Auto Hub"}));
        }
      } else {
        // Responsável = Comprador: apenas acompanhamento, cancelar CP existente se houver
        if(cpCanalExist.length>0&&id){
          promises.push(col("contasPagar").doc(cpCanalExist[0].id).update({status:"Cancelado",taxaResponsavel:"Comprador"}));
        }
      }
    }
    Promise.all(promises).then(function(){notify(id?"Atualizado!":"Venda cadastrada!");closeModal();}).catch(function(e){notify("Erro ao gerar contas: "+e.message,"err");});
  }).catch(function(e){notify("Erro: "+e.message,"err");});
}

function avancarPipeline(id,nextStage){
  var upd={pipelineStage:nextStage};
  if(nextStage==="Liberado")upd.statusVenda="Concluída";
  col("vendas").doc(id).update(upd).then(function(){notify("Pipeline: "+nextStage+(nextStage==="Liberado"?" — Venda Concluída":""));}).catch(function(e){notify("Erro","err");});
}

function verVenda(id){
  var v=vendas.find(function(x){return x.id===id;});if(!v)return;
  var m=Number(v.valorVenda||0)-Number(v.valorCusto||0);
  var campos=[["Placa",escH(v.placa)],["Modelo",escH(v.modelo)],["Data",fmtDate(v.dataVenda)],["Vendedor",escH(v.vendedor||"-")],["Local",escH(v.localVeiculo||"-")],["Pipeline",pipBadge(v.pipelineStage)],["Comprador",escH(v.nomeComprador)],["Loja",escH(v.nomeLoja||"-")],["UF",escH(v.uf||"-")],["Telefone",escH(v.telefone||"-")],["CPF/CNPJ",escH(v.cpfCnpj||"-")],["Custo",fmtCur(v.valorCusto)],["Venda","<strong>"+fmtCur(v.valorVenda)+"</strong>"],["Margem","<strong style='color:"+(m>=0?"var(--green)":"var(--red)")+"'>"+fmtCur(m)+"</strong>"],["Status",bVenda(v.statusVenda)]];
  if(v.obs)campos.push(["Obs",escH(v.obs)]);
  if(v.emailComprador)campos.push(["Email",escH(v.emailComprador)]);
  if(v.linkBoleto)campos.push(["Link Boleto",'<a href="'+escH(v.linkBoleto)+'" target="_blank" style="color:var(--blue)">Abrir Boleto ↗</a>']);
  var h=campos.map(function(c){return'<div class="dr"><span style="color:var(--text2)">'+c[0]+'</span><span>'+c[1]+'</span></div>';}).join("");
  h+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn btn-s btn-sm" onclick="closeModal();relTab=\'placa\';dossieQ=\''+escH(v.placa)+'\';navigateTo(\'relatorios\')">📋 Dossiê da Placa</button>';
  h+='<button class="btn btn-p btn-sm" onclick="enviarEmailVenda(\''+v.id+'\')">✉️ Enviar Email ao Cliente</button>';
  h+='<button class="btn btn-g btn-sm" onclick="enviarWhatsApp(\''+v.id+'\')">💬 Enviar WhatsApp</button>';
  h+='</div>';
  showModal("Venda — "+escH(v.placa),h,null,"view");
}
function excluirVenda(id){confirmDlg("Excluir Venda","Esta ação não pode ser desfeita.",function(){col("vendas").doc(id).delete().then(function(){notify("Excluído");}).catch(function(e){notify("Erro","err");});});}

function cancelarVenda(id){
  var v=vendas.find(function(x){return x.id===id;});
  if(!v){notify("Venda não encontrada","err");return;}
  if(v.statusVenda==="Cancelada"){notify("Venda já está cancelada","err");return;}
  confirmDlg("Cancelar Negociação","Isso cancelará a venda e todos os Contas a Receber e Contas a Pagar vinculados. Deseja continuar?",function(){
    var promises=[];
    // Cancelar a venda
    promises.push(col("vendas").doc(id).update({statusVenda:"Cancelada",dataCancelamento:today()}));
    // Cancelar todos os CP vinculados
    var cpVinc=contasPagar.filter(function(x){return x.vendaId===id&&x.status!=="Cancelado";});
    cpVinc.forEach(function(x){promises.push(col("contasPagar").doc(x.id).update({status:"Cancelado"}));});
    // Cancelar todos os CR vinculados
    var crVinc=contasReceber.filter(function(x){return x.vendaId===id&&x.status!=="Cancelado";});
    crVinc.forEach(function(x){promises.push(col("contasReceber").doc(x.id).update({status:"Cancelado"}));});
    Promise.all(promises).then(function(){
      notify("Venda cancelada! "+cpVinc.length+" conta(s) a pagar e "+crVinc.length+" conta(s) a receber canceladas.");
    }).catch(function(e){notify("Erro ao cancelar: "+e.message,"err");});
  });
}

function relDRE(){
  var meses=getAllMeses();
  var h='<div class="sc"><div class="sc-header" style="background:var(--yellow-bg)"><span class="sc-title" style="color:var(--yellow)">📋 DRE — Demonstrativo de Resultados</span><div class="export-btns no-print"><button class="btn btn-s btn-sm" data-action="exportar-dre-xls">📊 Excel</button><button class="btn btn-s btn-sm" data-action="exportar-dre">⬇ CSV</button><button class="btn btn-s btn-sm" onclick="imprimirDRE()">🖨 PDF</button></div></div>';
  h+='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h+='<select onchange="dreMes=this.value;dreIni=\'\';dreFim=\'\';render()" style="width:auto;min-width:130px"><option value="">Período livre</option>';

    h+='<input type="date" value="'+dreIni+'" onchange="dreIni=this.value;render()" style="width:auto;min-width:130px">';
    h+='<span style="color:var(--text2);font-size:13px">até</span>';
    h+='<input type="date" value="'+dreFim+'" onchange="dreFim=this.value;render()" style="width:auto;min-width:130px">';
  }
  h+='</div>';
  function filtrarData(d){
    if(!d)return !dreMes&&!dreIni&&!dreFim;
    if(dreMes)return d.slice(0,7)===dreMes;
    if(dreIni&&d<dreIni)return false;
    if(dreFim&&d>dreFim)return false;
    return true;
  }
  var crRecebidos=contasReceber.filter(function(x){
    if(x.status!=="Recebido")return false;
    return filtrarData(x.dataRecebimento||x.vencimento||"");
  });
  var receitaConfirmada=crRecebidos.reduce(function(a,x){return a+Number(x.valor||0);},0);
  var vendasBoletoPago=vendas.filter(function(v){
    var stage=v.pipelineStage||"";
    return (stage==="Boleto Pago"||stage==="Aguardando Liberação"||stage==="Liberado")&&v.statusVenda!=="Cancelada"&&filtrarData(v.dataVenda||v.dataCriacao||"");
  });
  var recPend=0;
  vendasBoletoPago.forEach(function(v){
    var crDaVenda=contasReceber.filter(function(x){return x.vendaId===v.id;});
    crDaVenda.forEach(function(x){if(x.status!=="Recebido")recPend+=Number(x.valor||0);});
    if(!crDaVenda.length){var mg=Number(v.valorVenda||0)-Number(v.valorCusto||0);if(mg>0)recPend+=mg;}
  });
  var lFilt=lancamentos.filter(function(l){return filtrarData(l.data||"");});
  var cpPagas=contasPagar.filter(function(x){
    if(x.status!=="Pago")return false;
    return filtrarData(x.dataPagamento||x.vencimento||"");
  });
  var despOp={};
  CATS.filter(function(c){return c.tipo==="despesa"&&CATS_DRE_SKIP.indexOf(c.key)<0;}).forEach(function(c){
    var tL=lFilt.filter(function(l){return l.categoria===c.key;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    var tC=cpPagas.filter(function(x){return x.categoria===c.key;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var t=tL+tC;if(t>0)despOp[c.key]={label:c.label,total:t};
  });
  var recLancExtra=lFilt.filter(function(l){return catTipo(l.categoria)==="receita"&&CATS_DRE_SKIP.indexOf(l.categoria)<0;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var totDesp=Object.values(despOp).reduce(function(a,d){return a+d.total;},0);
  var resOp=(receitaConfirmada+recLancExtra)-totDesp;
  var cdb=lFilt.filter(function(l){return l.categoria==="saldo_cdb";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var resFinal=resOp+cdb;
  var totalEntrou=receitaConfirmada+recLancExtra;
  var saldoCaixa=totalEntrou-totDesp;
  var crPendGeral=contasReceber.filter(function(x){return x.status==="Pendente";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var cpPendGeral=contasPagar.filter(function(x){return x.status==="Pendente";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var periodo=dreMes?fmtMes(dreMes):(dreIni||dreFim?(fmtDate(dreIni)+" a "+fmtDate(dreFim)):"Todos os períodos");

  }
  h+='<div style="padding:16px">';
  h+='<div style="text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)"><div style="font-size:20px;font-weight:700;color:var(--blue)">AUTO HUB</div><div style="font-size:13px;color:var(--text2)">DRE — Demonstrativo do Resultado do Exercício</div><div style="font-size:12px;color:var(--text3);margin-top:4px">Período: <strong>'+escH(periodo)+'</strong> | Emitido em: '+fmtDate(today())+'</div></div>';
  h+=row("RECEITAS OPERACIONAIS",undefined,"dre-group");

  h+=row("DESPESAS OPERACIONAIS",undefined,"dre-group");

  else{h+='<div class="dre-row dre-sub" style="padding-left:14px"><span style="color:var(--text3);font-size:12px">Nenhuma despesa paga no período</span></div>';}
  h+=row("= RESULTADO DO PERÍODO",resOp,resOp>=0?"dre-total":"dre-neg");
  if(cdb!==0){h+=row("AJUSTES",undefined,"dre-group");h+=row("Saldo CDB",cdb,"dre-sub",1);}
  h+=row("= RESULTADO FINAL",resFinal,resFinal>=0?"dre-total":"dre-neg");
  h+='<div style="margin-top:20px;padding-top:14px;border-top:2px solid var(--border)">';
  h+=row("POSIÇÃO DE CAIXA (Realizado)",undefined,"dre-group");

  h+=row("(−) Total Pago",-totDesp,"dre-sub",1);
  h+=row("= SALDO DE CAIXA",saldoCaixa,saldoCaixa>=0?"dre-total":"dre-neg");
  h+='</div>';
  h+='<div style="margin-top:14px;padding:12px 14px;background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:var(--radius)"><div style="font-size:11px;font-weight:700;color:var(--yellow);text-transform:uppercase;margin-bottom:8px">⏳ Pendências (a realizar)</div><div style="display:flex;gap:20px;flex-wrap:wrap">';
  if(recPend>0)h+='<div><div style="font-size:11px;color:var(--text2)">Boleto pago, aguard. recebimento</div><div style="font-size:15px;font-weight:700;color:var(--yellow)">'+fmtCur(recPend)+'</div></div>';
  h+='<div><div style="font-size:11px;color:var(--text2)">A Receber pendente</div><div style="font-size:15px;font-weight:700;color:var(--green)">'+fmtCur(crPendGeral)+'</div></div>';
  h+='<div><div style="font-size:11px;color:var(--text2)">A Pagar pendente</div><div style="font-size:15px;font-weight:700;color:var(--red)">'+fmtCur(cpPendGeral)+'</div></div>';

  h+='</div></div></div></div>';
  return h;
}
function exportarDRE(){
  var rows=[["Descrição","Valor"]];
  document.querySelectorAll(".dre-row").forEach(function(el){
    var cols=el.querySelectorAll("span");
    if(cols.length>=2)rows.push([cols[0].textContent.trim(),cols[1].textContent.trim()]);
    else if(cols.length===1)rows.push([cols[0].textContent.trim(),""]);
  });
  // CSV com ponto-e-vírgula (compatível com Excel/WPS Brasil)
  var csv=rows.map(function(r){return r.map(function(c){return c.replace(/;/g,",");}).join(";");}).join("\r\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="dre_autohub.csv";a.click();URL.revokeObjectURL(url);
  notify("CSV exportado!");
}

  if(!venda&&!lancsPlaca.length&&!crPlaca.length&&!cpPlaca.length){return h+'<div class="sc"><div class="empty">Nenhum registro para <strong>'+escH(placa)+'</strong></div></div>';}
  if(venda){

    var despCpPagas=cpPlaca.filter(function(x){return x.status==="Pago";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var despCpPend=cpPlaca.filter(function(x){return x.status!=="Pago"&&x.status!=="Cancelado";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var totDespPagas=despLanc+despCpPagas;

    h+='<div style="margin-top:8px">'+pipBadge(venda.pipelineStage)+' '+bVenda(venda.statusVenda)+'</div></div>';
    h+='<div style="display:flex;gap:14px;flex-wrap:wrap;text-align:right">';
    h+='<div><div style="font-size:11px;color:var(--text2)">Custo</div><div style="font-size:15px;font-weight:700;color:var(--red)">'+fmtCur(venda.valorCusto)+'</div></div>';
    h+='<div><div style="font-size:11px;color:var(--text2)">Venda</div><div style="font-size:15px;font-weight:700">'+fmtCur(venda.valorVenda)+'</div></div>';
    h+='<div><div style="font-size:11px;color:var(--text2)">Margem Bruta</div><div style="font-size:15px;font-weight:700;color:var(--green)">'+fmtCur(margem)+'</div></div>';
    h+='<div><div style="font-size:11px;color:var(--text2)">Desp. Pagas</div><div style="font-size:15px;font-weight:700;color:var(--red)">'+fmtCur(totDespPagas)+'</div></div>';
    if(despCpPend>0)h+='<div><div style="font-size:11px;color:var(--yellow)">Desp. Pendentes</div><div style="font-size:15px;font-weight:700;color:var(--yellow)">'+fmtCur(despCpPend)+'</div></div>';
    h+='<div><div style="font-size:11px;color:var(--text2)">Resultado</div><div style="font-size:17px;font-weight:700;color:'+(resLiqReal>=0?"var(--green)":"var(--red)")+'">'+fmtCur(resLiqReal)+'</div></div>';
    if(despCpPend>0)h+='<div><div style="font-size:11px;color:var(--text3)">Projetado</div><div style="font-size:14px;font-weight:700;color:'+(resLiqProj>=0?"var(--green)":"var(--red)")+'">'+fmtCur(resLiqProj)+'</div></div>';
    h+='</div></div></div>';
  }
  if(lancsPlaca.length){h+='<div class="sc"><div class="sc-header" style="background:var(--gray-bg)"><span class="sc-title">Lançamentos</span></div><div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead><tbody>';lancsPlaca.forEach(function(l){var rec=catTipo(l.categoria)==="receita";h+='<tr><td>'+fmtDate(l.data)+'</td><td><span class="badge '+(rec?"bg":"br")+'">'+(rec?"Receita":"Despesa")+'</span></td><td>'+escH(l.descricao||"-")+'</td><td><span class="badge bo">'+catLabel(l.categoria)+'</span></td><td style="color:'+(rec?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(l.valor)+'</strong></td></tr>';});h+='</tbody></table></div></div>';}
  if(crPlaca.length){h+='<div class="sc"><div class="sc-header" style="background:var(--green-bg)"><span class="sc-title" style="color:var(--green)">A Receber</span></div><div style="overflow-x:auto"><table><thead><tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';crPlaca.forEach(function(x){h+='<tr><td>'+escH(x.descricao||"-")+'</td><td><strong style="color:var(--green)">'+fmtCur(x.valor)+'</strong></td><td>'+fmtDate(x.vencimento)+'</td><td><span class="badge '+(x.status==="Recebido"?"bg":x.status==="Cancelado"?"br":"by")+'">'+escH(x.status||"Pendente")+'</span></td></tr>';});h+='</tbody></table></div></div>';}
  if(cpPlaca.length){h+='<div class="sc"><div class="sc-header" style="background:var(--red-bg)"><span class="sc-title" style="color:var(--red)">A Pagar</span></div><div style="overflow-x:auto"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Parceiro</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';cpPlaca.forEach(function(x){h+='<tr><td>'+escH(x.descricao||"-")+'</td><td><span class="badge bo">'+catLabel(x.categoria||"outros")+'</span></td><td>'+escH((x.parceiro||x.comissario)||"-")+'</td><td><strong style="color:var(--red)">'+fmtCur(x.valor)+'</strong></td><td>'+fmtDate(x.vencimento)+'</td><td><span class="badge '+(x.status==="Pago"?"bg":x.status==="Cancelado"?"br":"by")+'">'+escH(x.status||"Pendente")+'</span></td></tr>';});h+='</tbody></table></div></div>';}
  return h;

    if(el&&!el.value)el.value=venda.nomeComprador;
  }
}

function addCategoria(){

    var tipo=gv("cat_tipo")||"despesa";
    var key="custom_"+nome.toLowerCase().replace(/[^a-z0-9]/g,"_").replace(/_+/g,"_").slice(0,40)+"_"+Date.now().toString(36);
    // Verificar duplicata
    var allCats=getCats();

    salvarCfg().then(function(){notify("Removida");});
  });

function cfgAdd(campo,label){
  showModal("Adicionar "+label,'<div class="fi"><label class="fl">'+label+'</label><input id="cfg_nome" placeholder="Digite o nome..."></div>',function(){

function cfgDel(campo,idx,def){

async function buscarCnpj(){
  var cnpj=(gv("cli_cpf")||"").replace(/\D/g,"");
  if(cnpj.length!==14){notify("Digite um CNPJ válido (14 dígitos)","err");return;}
  var btn=document.getElementById("cli_btn_cnpj");
  if(btn){btn.disabled=true;btn.textContent="🔍 Buscando...";}
  try{
    var r=await fetch("https://brasilapi.com.br/api/cnpj/v1/"+cnpj);
    if(!r.ok)throw new Error("CNPJ não encontrado");
    var d=await r.json();
    var nome=d.razao_social||d.nome_fantasia||"";
    var loja=d.nome_fantasia||"";
    var cep=(d.cep||"").replace(/\D/g,"");
    var cidade=d.municipio||"";
    var uf=d.uf||"";
    var bairro=d.bairro||"";
    var end=(d.logradouro||"")+(d.numero?" "+d.numero:"")+(d.complemento?" "+d.complemento:"");
    if(document.getElementById("cli_nome"))document.getElementById("cli_nome").value=nome;
    if(document.getElementById("cli_loja"))document.getElementById("cli_loja").value=loja;
    if(document.getElementById("cli_cep"))document.getElementById("cli_cep").value=cep;
    if(document.getElementById("cli_cidade"))document.getElementById("cli_cidade").value=cidade;
    if(document.getElementById("cli_bairro"))document.getElementById("cli_bairro").value=bairro;
    if(document.getElementById("cli_end"))document.getElementById("cli_end").value=end;
    var sel=document.getElementById("cli_uf");
    if(sel)sel.value=uf;
    notify("✅ Dados do CNPJ preenchidos!");
  }catch(e){notify("CNPJ não encontrado ou inválido","err");}
  if(btn){btn.disabled=false;btn.textContent="🔍 Buscar CNPJ";}
}

function converterLeadCliente(id){
  var l=leads.find(function(x){return x.id===id;});

  var tel=(l.whatsapp||"").replace(/\D/g,"");
  var existe=clientes.find(function(c){return(c.telefone||"").replace(/\D/g,"")===tel&&tel;});
  if(existe){notify("Cliente já cadastrado: "+escH(existe.nome||""),"err");return;}
  var data={nome:l.nome||"",telefone:l.whatsapp||"",cidade:l.cidade||"",tipo:l.tipo||"",origem:"lead-site",leadId:id,dataCriacao:today()};
  col("clientes").add(data).then(function(){
    col("leads").doc(id).update({status:"Aprovado",convertidoCliente:true}).catch(function(){});
    notify("✅ "+escH(l.nome||"")+" convertido em cliente!");
  }).catch(function(e){notify("Erro: "+e.message,"err");});
}

function calcReaisReceita(mes){return contasReceber.filter(function(x){return x.status==="Recebido"&&(x.dataRecebimento||x.vencimento||"").slice(0,7)===mes;}).reduce(function(a,x){return a+Number(x.valor||0);},0);}
function barraProgresso(real,meta,label,icone,fmt){
  if(!meta||meta<=0)return"";
  var pct=Math.min(100,Math.round((real/meta)*100));
  var cor=pct>=100?"var(--green)":pct>=70?"var(--yellow)":"var(--red)";
  var emoji=pct>=100?"✅":pct>=70?"⚠️":"🔴";
  var vlReal=fmt==="num"?real:fmtCur(real),vlMeta=fmt==="num"?meta:fmtCur(meta);
  return '<div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:600">'+icone+' '+label+'</span><span style="font-size:12px;color:var(--text2)">'+vlReal+' de '+vlMeta+' <strong style="color:'+cor+'">'+emoji+' '+pct+'%</strong></span></div><div style="background:var(--border);border-radius:99px;height:10px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+cor+';border-radius:99px;transition:width .6s ease"></div></div></div>';
}
function parseMoeda(v){return parseFloat((v||"0").replace(/\./g,"").replace(",","."))||0;}
function abrirModalMeta(id){
  var mt=id?(metas.find(function(x){return x.id===id;})||{}):{}; 
  var mes=mt.mes||getMesAtual();
  var h='<div class="fg">';
  h+='<div class="fi"><label class="fl">Mês de referência *</label><input type="month" id="mt_mes" value="'+mes+'"></div>';
  h+='<div class="fi"><label class="fl">🚗 Qtd de veículos a vender</label><input type="number" id="mt_qtd" min="0" value="'+(mt.qtdVendas||"")+'" placeholder="Ex: 20"></div>';
  h+='<div class="fi"><label class="fl">💰 Receita total (R$)</label><input id="mt_receita" value="'+(mt.receita?Number(mt.receita).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">🎯 Ticket médio por venda (R$)</label><input id="mt_ticket" value="'+(mt.ticketMedio?Number(mt.ticketMedio).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">📈 Lucro líquido desejado (R$)</label><input id="mt_lucro" value="'+(mt.lucro?Number(mt.lucro).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">👤 Novos clientes</label><input type="number" id="mt_clientes" min="0" value="'+(mt.novosClientes||"")+'" placeholder="Ex: 10"></div>';
  h+='</div>';
  showModal((id?"Editar Meta":"Definir Meta"),h,function(){salvarMeta(id);});
  ["mt_receita","mt_ticket","mt_lucro"].forEach(function(f){moedaInput(f);});
}
function salvarMeta(id){
  var mes=document.getElementById("mt_mes").value;
  if(!mes){notify("Informe o mês","err");return;}
  var exist=metas.find(function(x){return x.mes===mes&&x.id!==id;});
  if(exist){notify("Já existe meta para "+fmtMes(mes),"err");return;}
  var data={mes:mes,qtdVendas:parseInt(document.getElementById("mt_qtd").value)||0,receita:parseMoeda(document.getElementById("mt_receita").value),ticketMedio:parseMoeda(document.getElementById("mt_ticket").value),lucro:parseMoeda(document.getElementById("mt_lucro").value),novosClientes:parseInt(document.getElementById("mt_clientes").value)||0,atualizadoEm:today()};
  if(id){col("metas").doc(id).update(data).then(function(){notify("Meta atualizada!");closeModal();}).catch(function(e){notify("Erro","err");});}
  else{col("metas").add(data).then(function(){notify("Meta definida!");closeModal();}).catch(function(e){notify("Erro","err");});}
}
function excluirMeta(id){confirmDlg("Excluir Meta","Tem certeza?",function(){col("metas").doc(id).delete().then(function(){notify("Meta excluída");}).catch(function(e){notify("Erro","err");});});}
function renderMetas(){
  var mesAtual=getMesAtual();
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div><h2 style="font-size:18px;font-weight:700;margin:0">🎯 Metas</h2><p style="font-size:13px;color:var(--text2);margin:4px 0 0">Defina e acompanhe seus objetivos mensais</p></div>';
  h+='<button class="btn btn-p" onclick="abrirModalMeta()">+ Definir Meta</button></div>';
  if(!metas.length){h+='<div class="sc"><div class="empty" style="padding:60px">🎯<br><br>Nenhuma meta definida ainda.<br><span style="font-size:12px">Clique em <strong>Definir Meta</strong> para começar.</span></div></div>';return h;}
  h+='<div class="sc" style="margin-bottom:16px"><div style="padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  h+='<span style="font-size:13px;font-weight:600;color:var(--text2)">📅 Filtrar mês:</span>';
  h+='<select onchange="setMetaFiltro(this.value)" style="padding:6px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white)">';
  h+='<option value="">Todos os meses</option>';
  metas.forEach(function(mt){h+='<option value="'+mt.mes+'"'+(metaFiltroMes===mt.mes?' selected':'')+'>'+fmtMes(mt.mes)+'</option>';});
  h+='</select>';
  if(metaFiltroMes)h+='<button class="btn btn-s" style="font-size:12px" onclick="setMetaFiltro(\'\')">✕ Limpar</button>';
  h+='</div></div>';
  var metasFiltradas=metaFiltroMes?metas.filter(function(mt){return mt.mes===metaFiltroMes;}):metas;
  if(!metasFiltradas.length){h+='<div class="sc"><div class="empty">Nenhuma meta encontrada para este mês.</div></div>';return h;}
  metasFiltradas.forEach(function(mt){
    var mes=mt.mes||"";
    var vendasMes=calcReaisVendas(mes),qtdReal=vendasMes.length,receitaReal=calcReaisReceita(mes);
    var despMes=lancamentos.filter(function(l){return l.tipo==="despesa"&&(l.data||"").slice(0,7)===mes;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    var cpMesTodos=contasPagar.filter(function(x){return x.status==="Pago"&&(x.dataPagamento||x.vencimento||"").slice(0,7)===mes;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var lucroReal=receitaReal-despMes-cpMesTodos;
    var ticketReal=qtdReal>0?lucroReal/qtdReal:0;
    var clientesMes=[...new Set(vendasMes.map(function(v){return v.nomeComprador||"";}))].filter(function(n){return n;}).length;
    var isAtual=mes===mesAtual;
    var todasMetas=[mt.qtdVendas,mt.receita,mt.ticketMedio,mt.lucro,mt.novosClientes].every(function(x){return!x||x<=0;});
    h+='<div class="sc" style="margin-bottom:20px"><div class="sc-header">';
    h+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px">📅</span><div><div style="font-size:15px;font-weight:700">'+fmtMes(mes)+'</div>';
    if(isAtual)h+='<span style="font-size:11px;background:var(--blue-light);color:var(--blue);padding:2px 8px;border-radius:99px;font-weight:600">Mês atual</span>';
    h+='</div></div><div style="display:flex;gap:8px">';
    h+='<button class="btn btn-s" style="font-size:12px" onclick="abrirModalMeta(\''+mt.id+'\')">✏️ Editar</button>';
    h+='<button class="btn btn-d" style="font-size:12px" onclick="excluirMeta(\''+mt.id+'\')">🗑</button>';
    h+='</div></div><div style="padding:20px">';
    if(todasMetas){h+='<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Nenhum objetivo definido. Clique em ✏️ Editar para adicionar.</div>';}
    else{
      h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">';
      if(mt.qtdVendas>0){var p1=Math.min(100,Math.round(qtdReal/mt.qtdVendas*100));h+='<div class="mc" style="text-align:center"><div style="font-size:22px;font-weight:800;color:'+(p1>=100?"var(--green)":p1>=70?"var(--yellow)":"var(--red)")+'">'+qtdReal+'/'+mt.qtdVendas+'</div><div class="mc-label">🚗 Veículos</div></div>';}
      if(mt.receita>0){var p2=Math.min(100,Math.round(receitaReal/mt.receita*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p2>=100?"var(--green)":p2>=70?"var(--yellow)":"var(--red)")+'">'+p2+'%</div><div class="mc-label">💰 Receita</div></div>';}
      if(mt.ticketMedio>0){var p3=Math.min(100,Math.round(ticketReal/mt.ticketMedio*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p3>=100?"var(--green)":p3>=70?"var(--yellow)":"var(--red)")+'">'+p3+'%</div><div class="mc-label">🎯 Ticket Médio</div></div>';}
      if(mt.lucro>0){var p4=Math.min(100,Math.round(lucroReal/mt.lucro*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p4>=100?"var(--green)":p4>=70?"var(--yellow)":"var(--red)")+'">'+p4+'%</div><div class="mc-label">📈 Lucro</div></div>';}
      if(mt.novosClientes>0){var p5=Math.min(100,Math.round(clientesMes/mt.novosClientes*100));h+='<div class="mc" style="text-align:center"><div style="font-size:22px;font-weight:800;color:'+(p5>=100?"var(--green)":p5>=70?"var(--yellow)":"var(--red)")+'">'+clientesMes+'/'+mt.novosClientes+'</div><div class="mc-label">👤 Clientes</div></div>';}
      h+='</div>';
      if(mt.qtdVendas>0)h+=barraProgresso(qtdReal,mt.qtdVendas,"Veículos vendidos","🚗","num");
      if(mt.receita>0)h+=barraProgresso(receitaReal,mt.receita,"Receita total","💰","cur");
      if(mt.ticketMedio>0)h+=barraProgresso(ticketReal,mt.ticketMedio,"Ticket médio por venda","🎯","cur");
      if(mt.lucro>0)h+=barraProgresso(lucroReal,mt.lucro,"Lucro líquido","📈","cur");
      if(mt.novosClientes>0)h+=barraProgresso(clientesMes,mt.novosClientes,"Novos clientes","👤","num");
    }
    h+='</div></div>';
  });
  return h;
}

function novoUsuario(){
  showModal("Adicionar Usuário",'<div class="fg"><div class="fi"><label class="fl">Usuário</label><input id="nu_u" placeholder="Ex: operador1"></div><div class="fi"><label class="fl">Senha</label><input type="password" id="nu_p"></div><div class="fi full"><label class="fl">Confirmar Senha</label><input type="password" id="nu_p2"></div></div>',function(){
    var u=(gv("nu_u")||"").trim().toLowerCase(),p=gv("nu_p"),p2=gv("nu_p2");
    if(!u||u.length<3){notify("Mín. 3 caracteres","err");return;}if(USUARIOS[u]){notify("Já existe","err");return;}
    if(p.length<6){notify("Senha mín. 6 caracteres","err");return;}if(p!==p2){notify("Senhas não conferem","err");return;}
    USUARIOS[u]=p;salvarUsuarios();notify("Criado!");closeModal();render();
  });
}
function trocarSenha(user){
  var isMe=user===usuarioLogado;
  showModal("Alterar Senha",'<div class="fg">'+(isMe?'<div class="fi full"><label class="fl">Senha Atual</label><input type="password" id="ap_a"></div>':'')+'<div class="fi full"><label class="fl">Nova Senha</label><input type="password" id="ap_n"></div><div class="fi full"><label class="fl">Confirmar</label><input type="password" id="ap_c"></div></div>',function(){
    if(isMe&&gv("ap_a")!==USUARIOS[user]){notify("Senha atual incorreta","err");return;}
    var n=gv("ap_n");if(n.length<6){notify("Mín. 6 caracteres","err");return;}if(n!==gv("ap_c")){notify("Não conferem","err");return;}
    USUARIOS[user]=n;salvarUsuarios();notify("Senha alterada!");closeModal();
  });
}
function permUser(user){
  var perms=PERMISSOES_USUARIOS[user]||PERMISSOES_PADRAO.slice();
  var abas=TABS.filter(function(t){return t.id!=="usuarios";});
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  abas.forEach(function(t){var c=perms.indexOf(t.id)>=0;h+='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px"><input type="checkbox" id="perm_'+t.id+'"'+(c?" checked":"")+'>'+t.ico+' '+t.label+'</label>';});
  h+='</div>';
  showModal("Permissões — "+user,h,function(){
    var novas=abas.filter(function(t){var el=document.getElementById("perm_"+t.id);return el&&el.checked;}).map(function(t){return t.id;});

  });
}
function delUser(user){
  if(user==="admin"||user===usuarioLogado){notify("Não é possível remover","err");return;}
  confirmDlg("Remover Usuário","Deseja remover \""+user+"\"?",function(){delete USUARIOS[user];salvarUsuarios();notify("Removido");render();});
}

function showModal(title,body,saveFn,type){
  var ov=document.createElement("div");ov.className="overlay";ov.id="modalOverlay";
  var m=document.createElement("div");m.className="modal";
  var footer=saveFn?'<div class="mf"><button class="btn btn-s" onclick="closeModal()">Cancelar</button><button class="btn btn-p" id="mSaveBtn">Salvar</button></div>':'<div class="mf"><button class="btn btn-s" onclick="closeModal()">Fechar</button></div>';
  m.innerHTML='<div class="mh"><span class="mt">'+title+'</span><button class="mc2" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div>'+footer;
  ov.appendChild(m);ov.onclick=function(e){if(e.target===ov)closeModal();};document.body.appendChild(ov);
  if(saveFn){var btn=document.getElementById("mSaveBtn");if(btn)btn.onclick=saveFn;}
}
function closeModal(){var ov=document.getElementById("modalOverlay");if(ov)ov.remove();}
function confirmDlg(title,msg,fn){
  var ov=document.createElement("div");ov.className="co";
  var b=document.createElement("div");b.className="cb";
  b.innerHTML='<div style="font-size:28px;margin-bottom:10px">⚠️</div><h3 style="margin-bottom:8px">'+title+'</h3><p style="color:var(--text2);font-size:13px;margin-bottom:20px">'+msg+'</p><div style="display:flex;gap:8px;justify-content:center"></div>';
  var c=document.createElement("button");c.className="btn btn-s";c.textContent="Cancelar";c.onclick=function(){ov.remove();};
  var o=document.createElement("button");o.className="btn btn-d";o.textContent="Confirmar";o.onclick=function(){ov.remove();fn();};
  b.querySelector("div:last-child").appendChild(c);b.querySelector("div:last-child").appendChild(o);
  ov.appendChild(b);document.body.appendChild(ov);
}

    else if(a==="del-fornecedor")cfgDel("fornecedores",idx);
    else if(a==="add-tipo-pv")cfgAdd("tiposPv","Tipo de Solicitação");
    else if(a==="del-tipo-pv")cfgDel("tiposPv",idx,["Reclamação","Dúvida","Documentação","Transferência","Revisão","Outro"]);
    else if(a==="add-categoria")addCategoria();
    else if(a==="del-categoria")delCategoria(idx);
    else if(a==="novo-usuario")novoUsuario();
    else if(a==="trocar-senha")trocarSenha(id);
    else if(a==="trocar-senha-me")trocarSenha(usuarioLogado);
    else if(a==="perm-user")permUser(id);
    else if(a==="del-user")delUser(id);
  };
}

function imprimirRelFinanceiro(){
  var periodo=relMes?fmtMes(relMes):"Acumulado";
  var lancs=lancamentos.filter(function(l){if(relMes)return(l.data||"").slice(0,7)===relMes;return true;});
  var crRec=contasReceber.filter(function(x){if(x.status!=="Recebido")return false;var d=x.dataRecebimento||x.vencimento||"";if(relMes)return d.slice(0,7)===relMes;return true;});
  var cpPag=contasPagar.filter(function(x){if(x.status!=="Pago")return false;var d=x.dataPagamento||x.vencimento||"";if(relMes)return d.slice(0,7)===relMes;return true;});
  var tE=crRec.reduce(function(a,x){return a+Number(x.valor||0);},0)+lancs.filter(function(l){return catTipo(l.categoria)==="receita";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var tS=cpPag.reduce(function(a,x){return a+Number(x.valor||0);},0)+lancs.filter(function(l){return catTipo(l.categoria)==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);

  if(crRec.length){h2+='<div class="sec-title">Recebimentos</div><table><thead><tr><th>Data</th><th>Descrição</th><th>Placa</th><th>Valor</th></tr></thead><tbody>';crRec.forEach(function(x){h2+='<tr><td>'+fmtDate(x.dataRecebimento||x.vencimento)+'</td><td>'+escH(x.descricao||"-")+'</td><td>'+escH(x.placa||"-")+'</td><td class="green"><strong>'+fmtCur(x.valor)+'</strong></td></tr>';});h2+='</tbody></table>';}
  if(cpPag.length){h2+='<div class="sec-title">Pagamentos</div><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Placa</th><th>Valor</th></tr></thead><tbody>';cpPag.forEach(function(x){h2+='<tr><td>'+fmtDate(x.dataPagamento||x.vencimento)+'</td><td>'+escH(x.descricao||"-")+'</td><td>'+catLabel(x.categoria||"outros")+'</td><td>'+escH(x.placa||"-")+'</td><td class="red"><strong>'+fmtCur(x.valor)+'</strong></td></tr>';});h2+='</tbody></table>';}

    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows2),"Lancamentos");
  }
  var crP=contasReceber.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  if(crP.length){
    var rows3=[["Descricao","Valor","Vencimento","Status"]].concat(crP.map(function(x){return[x.descricao||"",Number(x.valor||0).toFixed(2),fmtDate(x.vencimento),x.status||""];}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows3),"A Receber");
  }
  var cpP=contasPagar.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  if(cpP.length){
    var rows4=[["Descricao","Categoria","Parceiro","Valor","Vencimento","Status"]].concat(cpP.map(function(x){return[x.descricao||"",catLabel(x.categoria||"outros"),(x.parceiro||x.comissario)||"",Number(x.valor||0).toFixed(2),fmtDate(x.vencimento),x.status||""];}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows4),"A Pagar");

function imprimirDossie(){
  if(!dossieQ){notify("Selecione uma placa","err");return;}
  var placa=dossieQ.trim().toUpperCase();
  var venda=vendas.find(function(v){return(v.placa||"").toUpperCase()===placa;});
  var lancsP=lancamentos.filter(function(l){return(l.placa||"").toUpperCase()===placa;});
  var crP=contasReceber.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  var cpP=contasPagar.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  var h2="";
  if(venda){
    var mg=Number(venda.valorVenda||0)-Number(venda.valorCusto||0);
    var despPagas=cpP.filter(function(x){return x.status==="Pago";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var despLanc=lancsP.filter(function(l){return catTipo(l.categoria)==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    var res=mg-(despPagas+despLanc);
    h2+='<div class="rp-title">Dossie — '+escH(placa)+'</div>';
    h2+='<div class="rp-summary"><div class="rp-s-item"><div class="rp-s-label">Modelo</div><div class="rp-s-val" style="font-size:13px">'+escH(venda.modelo||"")+'</div></div><div class="rp-s-item"><div class="rp-s-label">Comprador</div><div class="rp-s-val" style="font-size:13px">'+escH(venda.nomeComprador||"")+'</div></div><div class="rp-s-item"><div class="rp-s-label">Margem Bruta</div><div class="rp-s-val green">'+fmtCur(mg)+'</div></div><div class="rp-s-item"><div class="rp-s-label">Despesas</div><div class="rp-s-val red">'+fmtCur(despPagas+despLanc)+'</div></div><div class="rp-s-item"><div class="rp-s-label">Resultado</div><div class="rp-s-val '+(res>=0?"green":"red")+'">'+fmtCur(res)+'</div></div></div>';
  }
  if(lancsP.length){h2+='<div class="sec-title">Lancamentos</div><table><thead><tr><th>Data</th><th>Tipo</th><th>Descricao</th><th>Categoria</th><th>Valor</th></tr></thead><tbody>';lancsP.forEach(function(l){var rec=catTipo(l.categoria)==="receita";h2+='<tr><td>'+fmtDate(l.data)+'</td><td>'+(rec?"Receita":"Despesa")+'</td><td>'+escH(l.descricao||"-")+'</td><td>'+catLabel(l.categoria)+'</td><td class="'+(rec?"green":"red")+'">'+fmtCur(l.valor)+'</td></tr>';});h2+='</tbody></table>';}
  if(crP.length){h2+='<div class="sec-title">A Receber</div><table><thead><tr><th>Descricao</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';crP.forEach(function(x){h2+='<tr><td>'+escH(x.descricao||"-")+'</td><td class="green">'+fmtCur(x.valor)+'</td><td>'+fmtDate(x.vencimento)+'</td><td>'+escH(x.status||"Pendente")+'</td></tr>';});h2+='</tbody></table>';}
  if(cpP.length){h2+='<div class="sec-title">A Pagar</div><table><thead><tr><th>Descricao</th><th>Categoria</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';cpP.forEach(function(x){h2+='<tr><td>'+escH(x.descricao||"-")+'</td><td>'+catLabel(x.categoria||"outros")+'</td><td class="red">'+fmtCur(x.valor)+'</td><td>'+fmtDate(x.vencimento)+'</td><td>'+escH(x.status||"Pendente")+'</td></tr>';});h2+='</tbody></table>';}
  if(!h2)h2='<p style="color:#6B7280">Nenhum registro para '+escH(placa)+'</p>';
  imprimirRelatorio("Dossie — "+placa,h2);
}
