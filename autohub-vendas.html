<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--blue-dark:#1D4ED8;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --orange:#EA580C;--orange-bg:#FFF7ED;--orange-border:#FED7AA;
  --gray-bg:#F3F4F6;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.brand-name{font-size:13px;font-weight:700}
.brand-sub{font-size:10px;color:var(--text3)}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;width:100%;text-align:left;transition:all .12s;font-family:inherit;white-space:nowrap}
.nav-btn:hover{background:var(--blue-light);color:var(--blue)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-user{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue-dark);flex-shrink:0}
/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.metric-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px}
.metric-value{font-size:21px;font-weight:700;letter-spacing:-.5px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* SECTION */
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.sc-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sc-title{font-size:14px;font-weight:600}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.by{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.bb{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid)}
.bp{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.bo{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.bgr{background:var(--gray-bg);color:var(--text2);border:1px solid var(--border)}
/* BTN */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{opacity:.88}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-s{background:var(--white);color:var(--text);border-color:var(--border2)}
.btn-s:hover{background:var(--gray-bg)}
.btn-d{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-g{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.bico{padding:5px 7px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;line-height:1}
.bico:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}
/* FILTER */
.ftab{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;font-family:inherit}
.ftab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* SEARCH */
.sw{position:relative}
.sw input{padding-left:32px;min-width:200px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
/* FORM */
input,select,textarea{background:var(--white);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column}
.fi.full{grid-column:1/-1}
.fsec{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;grid-column:1/-1}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.mt{font-size:15px;font-weight:700}
.mc{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px;border-radius:4px}
.mc:hover{background:var(--gray-bg)}
.mb{padding:20px}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
/* NOTIFY */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-weight:500;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:320px;box-shadow:var(--shadow-md)}
#notif.show{opacity:1}
#notif.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#notif.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
/* LOGIN */
.ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.lb{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.li{width:60px;height:60px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 12px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.lf input{font-size:14px;padding:11px 14px}
.lbtn{width:100%;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.lerr{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}
/* CONFIRM */
.co{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500}
.cb{background:var(--white);border-radius:var(--radius-lg);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow-md)}
/* DRE */
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:3px}
.dre-group{font-weight:700;background:var(--blue-light);color:var(--blue-dark);margin-top:10px}
.dre-total{font-weight:700;font-size:15px;background:var(--green-bg);color:var(--green);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-neg{font-weight:700;font-size:15px;background:var(--red-bg);color:var(--red);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-sub{color:var(--text2)}
/* REL TABS */
.rel-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.rel-tab{padding:10px 18px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit;white-space:nowrap}
/* TOTALS BAR */
.tbar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap}
.ti{display:flex;flex-direction:column;gap:2px}
.tl{font-size:11px;color:var(--text2);font-weight:500}
.tv{font-size:16px;font-weight:700}
/* DETAIL */
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border-bottom:none}
/* VENCIMENTO ALERTA */
.venc-ok{color:var(--green)}
.venc-hj{color:var(--yellow);font-weight:600}
.venc-atrasado{color:var(--red);font-weight:600}
/* CONFIG */
.cfg-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--white)}
/* DOSSIE */
.dos-block{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.dos-placa{font-size:24px;font-weight:700;color:var(--blue-dark);letter-spacing:1px}
/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){#sidebar{position:fixed;height:100vh;z-index:100}.fg{grid-template-columns:1fr}.cards-row{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
// ══ FIREBASE ══
var FB={apiKey:"AIzaSyAlYPDKW9CVWO2c-hQCczqQ9ITClzCjImc",authDomain:"autohub-sistema-digital.firebaseapp.com",projectId:"autohub-sistema-digital",storageBucket:"autohub-sistema-digital.firebasestorage.app",messagingSenderId:"218267871676",appId:"1:218267871676:web:49061ac0b5d14047b523b9"};
var TENANT="autohub_vendas";

// ══ CATEGORIAS ══
var CATS=[
  {key:"venda_de_carros",label:"Venda de Carros",tipo:"receita"},
  {key:"intermediacao",label:"Intermediação",tipo:"receita"},
  {key:"comissao",label:"Comissão",tipo:"despesa"},
  {key:"marketing",label:"Marketing",tipo:"despesa"},
  {key:"outros",label:"Outros",tipo:"despesa"},
  {key:"compra_de_carros",label:"Compra de Carros",tipo:"despesa"},
  {key:"saldo_cdb",label:"Saldo CDB - Ajuste de Abertura",tipo:"receita"},
  {key:"fixo",label:"Custo Fixo",tipo:"despesa"},
  {key:"imposto",label:"Imposto",tipo:"despesa"},

  {key:"contabilidade",label:"Contabilidade",tipo:"despesa"},
  {key:"aluguel",label:"Aluguel",tipo:"despesa"},
  {key:"documentacao",label:"Documentação",tipo:"despesa"}
];
var CATS_DRE_SKIP=["venda_de_carros","compra_de_carros","saldo_cdb"];

// ══ ESTADO ══
var usuarioLogado=null,db=null,currentTab="dashboard";
var USUARIOS={admin:"hub2026"};
var PERMISSOES_USUARIOS={};
var PERMISSOES_PADRAO=["dashboard","vendas","financeiro","cxpagar","cxreceber","relatorios","posvenda"];
var vendas=[],lancamentos=[],contasPagar=[],contasReceber=[],posvenda=[],cfg={};
var vF="",vS="Todos";
var lF="Todos",lC="Todas",lQ="";

var dossieQ="";

var TABS=[
  {id:"dashboard",label:"Dashboard",ico:"📊"},
  {id:"vendas",label:"Vendas",ico:"🚗"},
  {id:"financeiro",label:"Financeiro",ico:"💰"},
  {id:"cxreceber",label:"Contas a Receber",ico:"📥"},
  {id:"cxpagar",label:"Contas a Pagar",ico:"📤"},

];

var BR_STATES=["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

var STATUS_PV=["Aberto","Em Atendimento","Resolvido","Cancelado"];
var STATUS_CX=["Pendente","Recebido","Pago","Atrasado","Cancelado"];

// ══ UTILS ══
function col(c){return db.collection("tenants/"+TENANT+"/"+c);}
function today(){return new Date().toISOString().split("T")[0];}
function gv(id){var e=document.getElementById(id);return e?e.value:"";}
function fmtCur(v){return"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2});}
function fmtDate(d){if(!d)return"-";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function toggleSidebar(){document.getElementById("sidebar").classList.toggle("collapsed");}

function moedaInput(id){var el=document.getElementById(id);if(el)el.addEventListener("input",function(){var v=this.value.replace(/\D/g,"");if(!v){this.value="";return;}this.value=(parseInt(v,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});});}
function getMoedaVal(id){var el=document.getElementById(id);if(!el)return 0;return Number((el.value||"").replace(/\./g,"").replace(",","."))||0;}
function vencClass(d){if(!d)return"";var diff=Math.floor((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000);if(diff<0)return"venc-atrasado";if(diff===0)return"venc-hj";return"venc-ok";}

function statusCxBadge(s){var m={Pendente:"by",Recebido:"bg",Pago:"bg",Atrasado:"br",Cancelado:"bgr"};return'<span class="badge '+(m[s]||"bgr")+'">'+escH(s||"Pendente")+'</span>';}

function carregarUsuarios(){try{var s=localStorage.getItem("ah_u_"+TENANT);if(s)Object.assign(USUARIOS,JSON.parse(s));}catch(e){}}

carregarUsuarios();carregarPermissoes();

function fazerLogin(){
  var user=(gv("loginUser")||"").trim().toLowerCase(),pass=gv("loginPass")||"";
  if(!USUARIOS[user]||USUARIOS[user]!==pass){document.getElementById("loginError").style.display="block";return;}
  document.getElementById("loginError").style.display="none";
  usuarioLogado=user;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("userLabel").textContent=user;
  document.getElementById("avatarEl").textContent=user.slice(0,2).toUpperCase();
  document.getElementById("todayDate").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
  initFirebase();buildNav();navigateTo("dashboard");
}
function fazerLogout(){usuarioLogado=null;location.reload();}

// ══ FIREBASE ══
function initFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.firestore();
  col("vendas").orderBy("dataCriacao","desc").onSnapshot(function(s){vendas=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView();});
  col("lancamentos").orderBy("data","desc").onSnapshot(function(s){lancamentos=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView();});
  col("contasPagar").orderBy("vencimento","asc").onSnapshot(function(s){contasPagar=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView();});
  col("contasReceber").orderBy("vencimento","asc").onSnapshot(function(s){contasReceber=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView();});
  col("posvenda").orderBy("dataSolicitacao","desc").onSnapshot(function(s){posvenda=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(currentTab==="posvenda")render();});
  col("config").doc("main").onSnapshot(function(s){if(s.exists)cfg=s.data();if(currentTab==="configuracoes")render();});
}
function salvarCfg(){return col("config").doc("main").set(cfg);}
function refreshView(){var tabs=["dashboard","vendas","financeiro","cxreceber","cxpagar","relatorios"];if(tabs.indexOf(currentTab)>=0)render();}

// ══ NAV ══
function buildNav(){
  var nav=document.getElementById("nav");nav.innerHTML="";
  TABS.forEach(function(t){
    if(!hasTab(t.id))return;
    var b=document.createElement("button");
    b.className="nav-btn"+(currentTab===t.id?" active":"");
    b.innerHTML='<span style="font-size:15px">'+t.ico+'</span><span>'+t.label+'</span>';
    b.onclick=function(){navigateTo(t.id);};
    nav.appendChild(b);
  });
}
function navigateTo(id){
  if(!hasTab(id))return;
  currentTab=id;
  document.getElementById("pageTitle").textContent=(TABS.find(function(x){return x.id===id;})||{label:""}).label;
  buildNav();render();
}

function render(){
  var c=document.getElementById("content");
  if(currentTab==="dashboard")c.innerHTML=renderDash();
  else if(currentTab==="vendas")c.innerHTML=renderVendas();
  else if(currentTab==="financeiro")c.innerHTML=renderFinanceiro();
  else if(currentTab==="cxreceber")c.innerHTML=renderCxReceber();
  else if(currentTab==="cxpagar")c.innerHTML=renderCxPagar();
  else if(currentTab==="relatorios")c.innerHTML=renderRelatorios();
  else if(currentTab==="posvenda")c.innerHTML=renderPosvenda();
  else if(currentTab==="configuracoes")c.innerHTML=renderConfiguracoes();
  else if(currentTab==="usuarios")c.innerHTML=renderUsuarios();
  bindActions();
}

// ══════════ DASHBOARD ══════════
function renderDash(){
  var ativas=vendas.filter(function(v){return v.statusVenda!=="Cancelada";});
  var volVendas=ativas.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var volCusto=ativas.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var margemTotal=volVendas-volCusto;
  // Cx a receber pendentes
  var crPend=contasReceber.filter(function(x){return x.status==="Pendente"||x.status==="Atrasado";});
  var crPendVal=crPend.reduce(function(a,x){return a+Number(x.valor||0);},0);
  // Cx a pagar pendentes
  var cpPend=contasPagar.filter(function(x){return x.status==="Pendente"||x.status==="Atrasado";});
  var cpPendVal=cpPend.reduce(function(a,x){return a+Number(x.valor||0);},0);
  // Atrasados
  var crAtrasados=contasReceber.filter(function(x){return x.vencimento&&x.vencimento<today()&&x.status==="Pendente";}).length;
  var cpAtrasados=contasPagar.filter(function(x){return x.vencimento&&x.vencimento<today()&&x.status==="Pendente";}).length;
  // Fluxo próx 7 dias
  var d7=new Date();d7.setDate(d7.getDate()+7);var d7s=d7.toISOString().split("T")[0];
  var entraSemana=contasReceber.filter(function(x){return x.status==="Pendente"&&x.vencimento>=today()&&x.vencimento<=d7s;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var saiSemana=contasPagar.filter(function(x){return x.status==="Pendente"&&x.vencimento>=today()&&x.vencimento<=d7s;}).reduce(function(a,x){return a+Number(x.valor||0);},0);

  var h='<div class="cards-row">';
  h+='<div class="metric-card"><div class="metric-label">Margem Total (Intermediação)</div><div class="metric-value" style="color:var(--green);font-size:17px">'+fmtCur(margemTotal)+'</div><div class="metric-sub">'+ativas.length+' veículos ativos</div></div>';
  h+='<div class="metric-card"><div class="metric-label">A Receber</div><div class="metric-value" style="color:var(--blue);font-size:17px">'+fmtCur(crPendVal)+'</div><div class="metric-sub">'+(crAtrasados?'<span style="color:var(--red)">'+crAtrasados+' atrasados</span>':crPend.length+' pendentes')+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">A Pagar</div><div class="metric-value" style="color:var(--red);font-size:17px">'+fmtCur(cpPendVal)+'</div><div class="metric-sub">'+(cpAtrasados?'<span style="color:var(--red)">'+cpAtrasados+' atrasados</span>':cpPend.length+' pendentes')+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Entra esta semana</div><div class="metric-value" style="color:var(--green);font-size:17px">'+fmtCur(entraSemana)+'</div><div class="metric-sub">Próximos 7 dias</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Sai esta semana</div><div class="metric-value" style="color:var(--red);font-size:17px">'+fmtCur(saiSemana)+'</div><div class="metric-sub">Próximos 7 dias</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Saldo Projetado (7d)</div><div class="metric-value" style="font-size:17px;color:'+(entraSemana-saiSemana>=0?"var(--green)":"var(--red)")+'">'+fmtCur(entraSemana-saiSemana)+'</div><div class="metric-sub">Entra − Sai</div></div>';
  h+='</div>';

  // Alertas
  var alerts=[];
  contasReceber.filter(function(x){return x.vencimento&&x.vencimento<today()&&x.status==="Pendente";}).forEach(function(x){alerts.push({tipo:"receber",txt:"A Receber atrasado: "+escH(x.descricao||x.placa||"")+" — "+fmtCur(x.valor)+" (venc. "+fmtDate(x.vencimento)+")"});});
  contasPagar.filter(function(x){return x.vencimento&&x.vencimento<today()&&x.status==="Pendente";}).forEach(function(x){alerts.push({tipo:"pagar",txt:"A Pagar atrasado: "+escH(x.descricao||"")+" — "+fmtCur(x.valor)+" (venc. "+fmtDate(x.vencimento)+")"});});
  if(alerts.length){
    h+='<div class="sc"><div class="sc-header" style="background:var(--red-bg)"><span class="sc-title" style="color:var(--red)">⚠️ Alertas de Vencimento</span></div><div style="padding:12px 16px">';
    alerts.forEach(function(a){h+='<div style="padding:8px 12px;border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:6px;font-size:13px;color:var(--red)">'+a.txt+'</div>';});
    h+='</div></div>';
  }

  // Últimas vendas
  h+='<div class="sc"><div class="sc-header"><span class="sc-title">Últimas Vendas</span><button class="btn btn-s btn-sm" onclick="navigateTo(\'vendas\')">Ver todas →</button></div>';
  var rec=vendas.slice(0,6);
  if(!rec.length){h+='<div class="empty">Nenhuma venda cadastrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comprador</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Status</th></tr></thead><tbody>';
    rec.forEach(function(v){var m=Number(v.valorVenda||0)-Number(v.valorCusto||0);h+='<tr><td><strong>'+escH(v.placa||"-")+'</strong></td><td>'+escH(v.modelo||"-")+'</td><td>'+escH(v.nomeComprador||"-")+'</td><td>'+fmtCur(v.valorCusto)+'</td><td><strong>'+fmtCur(v.valorVenda)+'</strong></td><td style="color:'+(m>=0?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(m)+'</strong></td><td>'+bVenda(v.statusVenda)+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

function bVenda(s){if(s==="Concluída")return'<span class="badge bg">'+escH(s)+'</span>';if(s==="Cancelada")return'<span class="badge br">'+escH(s)+'</span>';return'<span class="badge by">'+(s||"Em Andamento")+'</span>';}
function bBoleto(s){if(s==="Pago")return'<span class="badge bg">Pago</span>';if(s==="Cancelado")return'<span class="badge br">Cancelado</span>';return'<span class="badge by">Pendente</span>';}

function salvarVenda(id){
  var placa=(gv("v_placa")||"").toUpperCase().trim();
  var modelo=(gv("v_modelo")||"").trim();
  var comprador=(gv("v_comprador")||"").trim();
  if(!placa||!modelo||!comprador){notify("Preencha Placa, Modelo e Comprador","err");return;}
  var custo=getMoedaVal("v_custo"),venda=getMoedaVal("v_venda"),margem=venda-custo;
  var gerarCr=gv("v_gerarCr"),vencCr=gv("v_vencCr");
  var data={loja:"AUTO HUB",dataVenda:gv("v_data"),placa:placa,modelo:modelo,localVeiculo:gv("v_local"),vendedor:gv("v_vendedor"),valorCusto:custo,valorVenda:venda,statusVenda:gv("v_status"),boletoEnviado:gv("v_boleto"),statusBoleto:gv("v_statusBoleto"),dataPagamento:gv("v_dataPgto")||null,nomeComprador:comprador,nomeLoja:gv("v_loja"),uf:gv("v_uf"),telefone:gv("v_tel"),cpfCnpj:gv("v_cpf"),obs:gv("v_obs"),gerarCr:gerarCr,vencCr:vencCr};
  var promise;
  if(id){promise=col("vendas").doc(id).update(data);}
  else{data.dataCriacao=today();promise=col("vendas").add(data);}
  promise.then(function(ref){
    // Gerar conta a receber automaticamente para novas vendas
    if(!id&&gerarCr==="Sim"&&margem>0){
      var idVenda=ref?ref.id:"";
      col("contasReceber").add({descricao:"Intermediação — "+placa+" "+modelo,placa:placa,valor:margem,vencimento:vencCr,status:"Pendente",vendaId:idVenda,dataCriacao:today()});
    }
    notify(id?"Venda atualizada!":"Venda cadastrada!");closeModal();
  }).catch(function(e){notify("Erro: "+e.message,"err");});
}

function verVenda(id){
  var v=vendas.find(function(x){return x.id===id;});if(!v)return;
  var m=Number(v.valorVenda||0)-Number(v.valorCusto||0);
  var campos=[["Placa",escH(v.placa)],["Modelo",escH(v.modelo)],["Data",fmtDate(v.dataVenda)],["Vendedor",escH(v.vendedor||"-")],["Local",escH(v.localVeiculo||"-")],["Comprador",escH(v.nomeComprador)],["Loja",escH(v.nomeLoja||"-")],["UF",escH(v.uf||"-")],["Telefone",escH(v.telefone||"-")],["CPF/CNPJ",escH(v.cpfCnpj||"-")],["Valor de Custo",fmtCur(v.valorCusto)],["Valor de Venda","<strong>"+fmtCur(v.valorVenda)+"</strong>"],["Margem (Intermediação)","<strong style='color:"+(m>=0?"var(--green)":"var(--red)")+"'>"+fmtCur(m)+"</strong>"],["Status",bVenda(v.statusVenda)],["Boleto Enviado",escH(v.boletoEnviado||"Não")],["Status Boleto",bBoleto(v.statusBoleto)]];
  if(v.dataPagamento)campos.push(["Data Pagamento",fmtDate(v.dataPagamento)]);
  if(v.obs)campos.push(["Obs",escH(v.obs)]);
  var h=campos.map(function(c){return'<div class="dr"><span style="color:var(--text2);font-weight:500">'+c[0]+'</span><span>'+c[1]+'</span></div>';}).join("");
  h+='<div style="margin-top:14px"><button class="btn btn-s btn-sm" onclick="navigateTo(\'relatorios\');relTab=\'placa\';document.getElementById(\'dossieQ\').value=\''+escH(v.placa)+'\';dossieQ=\''+escH(v.placa)+'\';render()">📋 Ver Dossiê da Placa</button></div>';
  showModal("Venda — "+escH(v.placa),h,null,"view");
}
function excluirVenda(id){confirmDlg("Excluir Venda","Esta ação não pode ser desfeita.",function(){col("vendas").doc(id).delete().then(function(){notify("Excluído");}).catch(function(e){notify("Erro: "+e.message,"err");});});}

// ══════════ FINANCEIRO ══════════

function relVendas(){
  var ok=vendas.filter(function(v){return v.statusVenda!=="Cancelada";});
  var tv=ok.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var tc=ok.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var tm=tv-tc;var pct=tv>0?((tm/tv)*100).toFixed(1):0;
  var h='<div class="cards-row"><div class="metric-card"><div class="metric-label">Vendas Ativas</div><div class="metric-value" style="color:var(--blue)">'+ok.length+'</div></div><div class="metric-card"><div class="metric-label">Volume Total</div><div class="metric-value" style="font-size:16px">'+fmtCur(tv)+'</div></div><div class="metric-card"><div class="metric-label">Custo Total</div><div class="metric-value" style="font-size:16px;color:var(--red)">'+fmtCur(tc)+'</div></div><div class="metric-card"><div class="metric-label">Margem Total</div><div class="metric-value" style="font-size:16px;color:var(--green)">'+fmtCur(tm)+'</div><div class="metric-sub">'+pct+'% sobre vendas</div></div></div>';
  // Por vendedor
  var pv={};ok.forEach(function(v){var vd=v.vendedor||"Sem vendedor";if(!pv[vd])pv[vd]={qtd:0,vol:0,custo:0};pv[vd].qtd++;pv[vd].vol+=Number(v.valorVenda||0);pv[vd].custo+=Number(v.valorCusto||0);});
  h+='<div class="sc"><div class="sc-header" style="background:var(--blue-light)"><span class="sc-title" style="color:var(--blue)">Desempenho por Vendedor</span></div><div style="overflow-x:auto"><table><thead><tr><th>Vendedor</th><th>Qtd</th><th>Volume</th><th>Custo</th><th>Margem</th><th>% Margem</th></tr></thead><tbody>';
  Object.keys(pv).sort().forEach(function(vd){var d=pv[vd];var m=d.vol-d.custo;var p=d.vol>0?((m/d.vol)*100).toFixed(1):0;h+='<tr><td><strong>'+escH(vd)+'</strong></td><td>'+d.qtd+'</td><td>'+fmtCur(d.vol)+'</td><td>'+fmtCur(d.custo)+'</td><td style="color:'+(m>=0?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(m)+'</strong></td><td><span class="badge '+(m>=0?"bg":"br")+'">'+p+'%</span></td></tr>';});
  if(!Object.keys(pv).length)h+='<tr><td colspan="6" class="empty">Sem dados</td></tr>';
  h+='</tbody></table></div></div>';
  // Por UF
  var pu={};ok.forEach(function(v){var u=v.uf||"-";if(!pu[u])pu[u]={qtd:0,vol:0};pu[u].qtd++;pu[u].vol+=Number(v.valorVenda||0);});
  h+='<div class="sc"><div class="sc-header" style="background:var(--blue-light)"><span class="sc-title" style="color:var(--blue)">Vendas por UF</span></div><div style="overflow-x:auto"><table><thead><tr><th>UF</th><th>Qtd</th><th>Volume</th></tr></thead><tbody>';

}

function relDRE(){
  var h='<div class="sc"><div class="sc-header" style="background:var(--yellow-bg)"><span class="sc-title" style="color:var(--yellow)">DRE — Demonstrativo de Resultados</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="date" id="dreIniI" value="'+dreIni+'" onchange="dreIni=this.value;render()" style="width:auto;min-width:130px"><span style="color:var(--text2);font-size:13px">até</span><input type="date" id="dreFimI" value="'+dreFim+'" onchange="dreFim=this.value;render()" style="width:auto;min-width:130px"><button class="btn btn-s btn-sm" data-action="exportar-dre">⬇ CSV</button></div></div>';
  var lF2=lancamentos.filter(function(l){if(dreIni&&l.data<dreIni)return false;if(dreFim&&l.data>dreFim)return false;return true;});
  var vF2=vendas.filter(function(v){if(v.statusVenda==="Cancelada")return false;var d=v.dataVenda||v.dataCriacao||"";if(dreIni&&d<dreIni)return false;if(dreFim&&d>dreFim)return false;return true;});
  var recVendas=vF2.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var custoVendas=vF2.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var margemBruta=recVendas-custoVendas;
  var despOp={};
  CATS.filter(function(c){return c.tipo==="despesa"&&CATS_DRE_SKIP.indexOf(c.key)<0;}).forEach(function(c){
    var t=lF2.filter(function(l){return l.categoria===c.key;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    if(t>0)despOp[c.key]={label:c.label,total:t};
  });
  var totDesp=Object.values(despOp).reduce(function(a,d){return a+d.total;},0);
  var resOp=margemBruta-totDesp;
  var cdb=lF2.filter(function(l){return l.categoria==="saldo_cdb";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var resFinal=resOp+cdb;

  function row(label,val,cls,indent){
    var pi=(indent||0)*20+14;
    if(val===undefined){return'<div class="dre-row '+cls+'" style="padding-left:'+pi+'px"><span>'+escH(label)+'</span></div>';}
    var abs=fmtCur(Math.abs(Number(val)));var cor=Number(val)>=0?"color:var(--green)":"color:var(--red)";
    return'<div class="dre-row '+cls+'" style="padding-left:'+pi+'px"><span>'+escH(label)+'</span><span style="'+cor+'"><strong>'+abs+'</strong></span></div>';
  }

  h+='<div style="padding:16px">';
  if(!dreIni&&!dreFim)h+='<div style="background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--yellow);margin-bottom:14px">⚠️ Selecione um período para filtrar o DRE. Sem filtro, considera todos os registros.</div>';
  h+=row("RECEITAS",undefined,"dre-group");
  h+=row("Receita Bruta de Vendas (Valor de Venda)",recVendas,"",1);
  h+=row("(−) Custo dos Veículos",-custoVendas,"dre-sub",1);
  h+=row("= MARGEM BRUTA (Intermediação)",margemBruta,margemBruta>=0?"dre-total":"dre-neg");
  h+=row("DESPESAS OPERACIONAIS",undefined,"dre-group");
  Object.values(despOp).forEach(function(d){h+=row("(−) "+d.label,-d.total,"dre-sub",1);});
  if(!Object.values(despOp).length)h+='<div class="dre-row dre-sub" style="padding-left:14px"><span>Sem despesas lançadas</span></div>';
  h+=row("= RESULTADO OPERACIONAL",resOp,resOp>=0?"dre-total":"dre-neg");
  if(cdb!==0){h+=row("OUTROS / AJUSTES",undefined,"dre-group");h+=row("Saldo CDB — Ajuste de Abertura",cdb,"dre-sub",1);}
  h+=row("= RESULTADO FINAL DO PERÍODO",resFinal,resFinal>=0?"dre-total":"dre-neg");
  h+='</div></div>';
  return h;
}

// ══════════ DOSSIÊ POR PLACA ══════════
function relPlaca(){
  var h='<div class="sc"><div class="sc-header"><span class="sc-title">🔎 Dossiê por Placa</span></div>';
  h+='<div style="padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">';
  h+='<div class="sw" style="flex:1"><span class="si">🔍</span><input type="text" id="dossieQ" placeholder="Digite a placa..." value="'+escH(dossieQ)+'" oninput="dossieQ=this.value.toUpperCase();render()" style="text-transform:uppercase;min-width:200px"></div>';
  h+='</div></div>';

  if(!dossieQ){
    // Listar todas as placas disponíveis
    var todasPlacas=vendas.map(function(v){return v.placa;}).filter(function(p,i,a){return p&&a.indexOf(p)===i;}).sort();
    h+='<div class="sc"><div style="padding:16px"><div style="font-size:13px;color:var(--text2);margin-bottom:10px">Selecione uma placa ou pesquise acima:</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
    todasPlacas.forEach(function(p){h+='<button class="btn btn-s btn-sm" onclick="dossieQ=\''+escH(p)+'\';render()">'+escH(p)+'</button>';});
    if(!todasPlacas.length)h+='<span style="color:var(--text3);font-size:13px">Nenhum veículo cadastrado</span>';
    h+='</div></div></div>';
    return h;
  }

  var placa=dossieQ.trim().toUpperCase();
  var venda=vendas.find(function(v){return(v.placa||"").toUpperCase()===placa;});
  var lancsPlaca=lancamentos.filter(function(l){return(l.placa||"").toUpperCase()===placa;});
  var crPlaca=contasReceber.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  var cpPlaca=contasPagar.filter(function(x){return(x.placa||"").toUpperCase()===placa;});

  if(!venda&&!lancsPlaca.length&&!crPlaca.length&&!cpPlaca.length){
    h+='<div class="sc"><div class="empty">Nenhum registro encontrado para a placa <strong>'+escH(placa)+'</strong></div></div>';
    return h;
  }

  // Header do dossiê
  if(venda){
    var margem=Number(venda.valorVenda||0)-Number(venda.valorCusto||0);
    h+='<div class="dos-block">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">';
    h+='<div><div class="dos-placa">'+escH(placa)+'</div><div style="font-size:16px;font-weight:600;margin-top:4px">'+escH(venda.modelo||"-")+'</div><div style="font-size:13px;color:var(--text2);margin-top:2px">Comprador: '+escH(venda.nomeComprador||"-")+' • Vendedor: '+escH(venda.vendedor||"-")+' • '+fmtDate(venda.dataVenda)+'</div></div>';
    h+='<div style="text-align:right"><div style="font-size:11px;color:var(--text2)">Custo</div><div style="font-size:15px;font-weight:700;color:var(--red)">'+fmtCur(venda.valorCusto)+'</div><div style="font-size:11px;color:var(--text2);margin-top:4px">Venda</div><div style="font-size:15px;font-weight:700">'+fmtCur(venda.valorVenda)+'</div></div>';
    h+='</div>';
    h+='<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--blue-mid);display:flex;gap:20px;flex-wrap:wrap">';
    h+='<div><div style="font-size:11px;color:var(--text2)">Margem Bruta</div><div style="font-size:18px;font-weight:700;color:'+(margem>=0?"var(--green)":"var(--red)")+'">'+fmtCur(margem)+'</div></div>';
    // Calcular resultado líquido
    var totalDespPlaca=lancsPlaca.filter(function(l){return catTipo(l.categoria)==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    var totalDespCp=cpPlaca.filter(function(x){return x.status==="Pago";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var totalDesp=totalDespPlaca+totalDespCp;
    var resultadoLiq=margem-totalDesp;
    h+='<div><div style="font-size:11px;color:var(--text2)">Despesas Vinculadas</div><div style="font-size:18px;font-weight:700;color:var(--red)">'+fmtCur(totalDesp)+'</div></div>';
    h+='<div><div style="font-size:11px;color:var(--text2)">Resultado Líquido</div><div style="font-size:18px;font-weight:700;color:'+(resultadoLiq>=0?"var(--green)":"var(--red)")+'">'+fmtCur(resultadoLiq)+'</div></div>';
    h+='<div>'+bVenda(venda.statusVenda)+'</div>';
    h+='</div></div>';
  }

  // Lançamentos vinculados
  if(lancsPlaca.length){
    h+='<div class="sc"><div class="sc-header" style="background:var(--gray-bg)"><span class="sc-title">Lançamentos Vinculados</span></div>';
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>';
    lancsPlaca.forEach(function(l){var rec=catTipo(l.categoria)==="receita";h+='<tr><td>'+fmtDate(l.data)+'</td><td>'+escH(l.descricao||"-")+'</td><td><span class="badge '+(rec?"bg":"bo")+'">'+catLabel(l.categoria)+'</span></td><td><span class="badge '+(rec?"bg":"br")+'">'+(rec?"Receita":"Despesa")+'</span></td><td style="color:'+(rec?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(l.valor)+'</strong></td></tr>';});
    h+='</tbody></table></div></div>';
  }

  // Contas a Receber vinculadas
  if(crPlaca.length){
    h+='<div class="sc"><div class="sc-header" style="background:var(--green-bg)"><span class="sc-title" style="color:var(--green)">Contas a Receber</span></div>';
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';
    crPlaca.forEach(function(x){h+='<tr><td>'+escH(x.descricao||"-")+'</td><td><strong style="color:var(--green)">'+fmtCur(x.valor)+'</strong></td><td>'+fmtDate(x.vencimento)+'</td><td>'+statusCxBadge(x.status)+'</td></tr>';});
    h+='</tbody></table></div></div>';
  }

  // Contas a Pagar vinculadas
  if(cpPlaca.length){
    h+='<div class="sc"><div class="sc-header" style="background:var(--red-bg)"><span class="sc-title" style="color:var(--red)">Contas a Pagar</span></div>';
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Comissário</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';
    cpPlaca.forEach(function(x){h+='<tr><td>'+escH(x.descricao||"-")+'</td><td><span class="badge bo">'+catLabel(x.categoria||"outros")+'</span></td><td>'+escH(x.comissario||"-")+'</td><td><strong style="color:var(--red)">'+fmtCur(x.valor)+'</strong></td><td>'+fmtDate(x.vencimento)+'</td><td>'+statusCxBadge(x.status)+'</td></tr>';});
    h+='</tbody></table></div></div>';
  }

  return h;
}

function exportarDRE(){
  var rows=[["Descrição","Valor"]];
  document.querySelectorAll(".dre-row").forEach(function(el){
    var cols=el.querySelectorAll("span");
    if(cols.length>=2)rows.push([cols[0].textContent.trim(),cols[1].textContent.trim()]);
    else if(cols.length===1)rows.push([cols[0].textContent.trim(),""]);
  });
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="dre_autohub.csv";a.click();URL.revokeObjectURL(url);
  notify("DRE exportado!");
}

function abrirModalPv(id){

function salvarPv(id){
  var cli=(gv("pv_cli")||"").trim();if(!cli){notify("Preencha o cliente","err");return;}
  var data={cliente:cli,veiculo:gv("pv_vei"),dataSolicitacao:gv("pv_data"),tipoSolicitacao:gv("pv_tipo"),statusPv:gv("pv_status"),obs:gv("pv_obs")};
  if(id){col("posvenda").doc(id).update(data).then(function(){notify("Atualizado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
  else{data.dataCriacao=today();col("posvenda").add(data).then(function(){notify("Cadastrado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
}
function excluirPv(id){confirmDlg("Excluir","Tem certeza?",function(){col("posvenda").doc(id).delete().then(function(){notify("Excluído");}).catch(function(e){notify("Erro: "+e.message,"err");});});}

function cfgAdd(campo,label){
  showModal("Adicionar "+label,'<div class="fi"><label class="fl">'+label+'</label><input id="cfg_nome" placeholder="Digite o nome..."></div>',function(){
    var nome=(gv("cfg_nome")||"").trim();if(!nome){notify("Digite o nome","err");return;}
    if(!cfg[campo])cfg[campo]=[];
    if(cfg[campo].indexOf(nome)>=0){notify("Já cadastrado","err");return;}
    cfg[campo].push(nome);salvarCfg().then(function(){notify("Adicionado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});
  });
}
function cfgDel(campo,idx,defaultArr){
  confirmDlg("Remover","Tem certeza?",function(){
    if(!cfg[campo])cfg[campo]=defaultArr?defaultArr.slice():[];
    cfg[campo].splice(idx,1);salvarCfg().then(function(){notify("Removido");});
  });
}

// ══════════ USUÁRIOS ══════════
function renderUsuarios(){
  var isAdmin=usuarioLogado==="admin";
  var h='<div class="sc"><div class="sc-header"><span class="sc-title">Minha Conta</span></div><div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-s" data-action="trocar-senha-me">🔒 Alterar Senha</button><button class="btn btn-d" onclick="fazerLogout()">Sair</button></div></div>';
  if(!isAdmin)return h;
  h+='<div class="sc" style="margin-top:16px"><div class="sc-header"><span class="sc-title">Gerenciar Usuários</span><button class="btn btn-p" data-action="novo-usuario">+ Adicionar</button></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Usuário</th><th>Permissões</th><th>Ações</th></tr></thead><tbody>';
  Object.keys(USUARIOS).forEach(function(u){
    var perms=getUserPerms(u);
    h+='<tr><td><strong>'+escH(u)+'</strong></td><td>'+(perms===null?'<span class="badge bb">Admin</span>':'<span class="badge bgr">'+perms.length+' abas</span>')+'</td><td><div style="display:flex;gap:4px"><button class="btn btn-s btn-sm" data-action="trocar-senha" data-id="'+u+'">Senha</button>'+(u!=="admin"?'<button class="btn btn-s btn-sm" data-action="perm-user" data-id="'+u+'">Permissões</button><button class="btn btn-d btn-sm" data-action="del-user" data-id="'+u+'">Remover</button>':'')+'</div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}
function novoUsuario(){
  showModal("Adicionar Usuário",'<div class="fg"><div class="fi"><label class="fl">Usuário</label><input id="nu_u" placeholder="Ex: operador1"></div><div class="fi"><label class="fl">Senha</label><input type="password" id="nu_p"></div><div class="fi full"><label class="fl">Confirmar Senha</label><input type="password" id="nu_p2"></div></div>',function(){
    var u=(gv("nu_u")||"").trim().toLowerCase(),p=gv("nu_p"),p2=gv("nu_p2");
    if(!u||u.length<3){notify("Mín. 3 caracteres","err");return;}
    if(USUARIOS[u]){notify("Já existe","err");return;}
    if(p.length<6){notify("Senha mín. 6 caracteres","err");return;}
    if(p!==p2){notify("Senhas não conferem","err");return;}
    USUARIOS[u]=p;salvarUsuarios();notify("Criado!");closeModal();render();
  });
}
function trocarSenha(user){
  var isMe=user===usuarioLogado;
  showModal("Alterar Senha",'<div class="fg">'+(isMe?'<div class="fi full"><label class="fl">Senha Atual</label><input type="password" id="ap_a"></div>':'')+'<div class="fi full"><label class="fl">Nova Senha</label><input type="password" id="ap_n"></div><div class="fi full"><label class="fl">Confirmar</label><input type="password" id="ap_c"></div></div>',function(){
    if(isMe&&gv("ap_a")!==USUARIOS[user]){notify("Senha atual incorreta","err");return;}
    var n=gv("ap_n");if(n.length<6){notify("Mín. 6 caracteres","err");return;}if(n!==gv("ap_c")){notify("Não conferem","err");return;}
    USUARIOS[user]=n;salvarUsuarios();notify("Senha alterada!");closeModal();
  });
}
function permUser(user){
  var perms=PERMISSOES_USUARIOS[user]||PERMISSOES_PADRAO.slice();
  var abas=TABS.filter(function(t){return t.id!=="usuarios";});
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  abas.forEach(function(t){var c=perms.indexOf(t.id)>=0;h+='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px"><input type="checkbox" id="perm_'+t.id+'"'+(c?" checked":"")+'>'+t.ico+' '+t.label+'</label>';});
  h+='</div>';
  showModal("Permissões — "+user,h,function(){
    var novas=abas.filter(function(t){var el=document.getElementById("perm_"+t.id);return el&&el.checked;}).map(function(t){return t.id;});
    PERMISSOES_USUARIOS[user]=novas;salvarPermissoes();notify("Permissões atualizadas!");closeModal();render();
  });
}
function delUser(user){
  if(user==="admin"||user===usuarioLogado){notify("Não é possível remover","err");return;}
  confirmDlg("Remover Usuário","Deseja remover \""+user+"\"?",function(){delete USUARIOS[user];salvarUsuarios();notify("Removido");render();});
}

// ══ MODAL ══
function showModal(title,body,saveFn,type){
  var ov=document.createElement("div");ov.className="overlay";ov.id="modalOverlay";
  var m=document.createElement("div");m.className="modal";
  var footer=saveFn?'<div class="mf"><button class="btn btn-s" onclick="closeModal()">Cancelar</button><button class="btn btn-p" id="mSaveBtn">Salvar</button></div>':'<div class="mf"><button class="btn btn-s" onclick="closeModal()">Fechar</button></div>';
  m.innerHTML='<div class="mh"><span class="mt">'+title+'</span><button class="mc" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div>'+footer;
  ov.appendChild(m);ov.onclick=function(e){if(e.target===ov)closeModal();};document.body.appendChild(ov);
  if(saveFn){var btn=document.getElementById("mSaveBtn");if(btn)btn.onclick=saveFn;}
}
function closeModal(){var ov=document.getElementById("modalOverlay");if(ov)ov.remove();}
function confirmDlg(title,msg,fn){
  var ov=document.createElement("div");ov.className="co";
  var b=document.createElement("div");b.className="cb";
  b.innerHTML='<div style="font-size:28px;margin-bottom:10px">⚠️</div><h3 style="margin-bottom:8px">'+title+'</h3><p style="color:var(--text2);font-size:13px;margin-bottom:20px">'+msg+'</p><div style="display:flex;gap:8px;justify-content:center"></div>';
  var c=document.createElement("button");c.className="btn btn-s";c.textContent="Cancelar";c.onclick=function(){ov.remove();};
  var o=document.createElement("button");o.className="btn btn-d";o.textContent="Confirmar";o.onclick=function(){ov.remove();fn();};
  b.querySelector("div:last-child").appendChild(c);b.querySelector("div:last-child").appendChild(o);
  ov.appendChild(b);document.body.appendChild(ov);
}

// ══ EVENTS ══
function bindActions(){
  document.getElementById("content").onclick=function(e){
    var el=e.target.closest("[data-action]");if(!el)return;
    var a=el.getAttribute("data-action"),id=el.getAttribute("data-id"),idx=parseInt(el.getAttribute("data-idx"));
    if(a==="nova-venda")abrirModalVenda(null);
    else if(a==="editar-venda")abrirModalVenda(id);
    else if(a==="ver-venda")verVenda(id);
    else if(a==="excluir-venda")excluirVenda(id);
    else if(a==="novo-lanc")abrirModalLanc(null);
    else if(a==="editar-lanc")abrirModalLanc(id);
    else if(a==="excluir-lanc")excluirLanc(id);
    else if(a==="nova-cr")abrirModalCr(null);
    else if(a==="editar-cr")abrirModalCr(id);
    else if(a==="excluir-cr")excluirCr(id);
    else if(a==="receber-cr")receberCr(id);
    else if(a==="nova-cp")abrirModalCp(null);
    else if(a==="editar-cp")abrirModalCp(id);
    else if(a==="excluir-cp")excluirCp(id);
    else if(a==="pagar-cp")pagarCp(id);
    else if(a==="novo-pv")abrirModalPv(null);
    else if(a==="editar-pv")abrirModalPv(id);
    else if(a==="excluir-pv")excluirPv(id);
    else if(a==="exportar-dre")exportarDRE();
    else if(a==="add-vendedor")cfgAdd("vendedores","Vendedor");
    else if(a==="del-vendedor")cfgDel("vendedores",idx);
    else if(a==="add-comissario")cfgAdd("comissarios","Comissário");
    else if(a==="del-comissario")cfgDel("comissarios",idx);
    else if(a==="add-tipo-pv")cfgAdd("tiposPv","Tipo de Solicitação");
    else if(a==="del-tipo-pv")cfgDel("tiposPv",idx,["Reclamação","Dúvida","Documentação","Transferência","Revisão","Outro"]);
    else if(a==="novo-usuario")novoUsuario();
    else if(a==="trocar-senha")trocarSenha(id);
    else if(a==="trocar-senha-me")trocarSenha(usuarioLogado);
    else if(a==="perm-user")permUser(id);
    else if(a==="del-user")delUser(id);
  };
}
