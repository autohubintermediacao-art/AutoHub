<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO HUB | Gestão de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--blue-dark:#1D4ED8;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --gray-bg:#F3F4F6;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

/* SIDEBAR */
.brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:-.5px;flex-shrink:0}
.brand-name{font-size:13px;font-weight:700;color:var(--text)}
.brand-sub{font-size:10px;color:var(--text3)}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:12px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;width:100%;text-align:left;transition:all .12s;font-family:inherit}
.nav-btn:hover{background:var(--blue-light);color:var(--blue)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-btn .ico{font-size:15px;width:18px;text-align:center}
.nav-user{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue-dark);flex-shrink:0}

/* TOPBAR */
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-date{font-size:12px;color:var(--text3)}

/* CARDS MÉTRICA */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.metric-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px}
.metric-value{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* TABELA */
.section-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.section-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.section-title{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.empty-state{padding:40px;text-align:center;color:var(--text3);font-size:13px}

/* BADGES STATUS */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-pendente{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.badge-pago{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-cancelado{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-blue{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}

/* BOTÕES */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{opacity:.88}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--border2)}
.btn-secondary:hover{background:var(--gray-bg)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 8px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s}
.btn-icon:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}

/* FILTROS */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-tab{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;font-family:inherit}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap input{padding-left:32px;min-width:220px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

/* FORM */
input,select,textarea{background:var(--white);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
label.field-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column}
.field.full{grid-column:1/-1}
.field.col3{grid-column:span 1}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--gray-bg);color:var(--text)}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}

/* NOTIFY */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-weight:500;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:320px;box-shadow:var(--shadow-md)}
#notif.show{opacity:1}
#notif.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#notif.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.login-logo{text-align:center;margin-bottom:28px}
.login-icon{width:60px;height:60px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 12px;letter-spacing:-.5px}
.login-title{font-size:20px;font-weight:700}
.login-sub{font-size:13px;color:var(--text2);margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.login-field input{font-size:14px;padding:11px 14px}
.login-btn{width:100%;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px;transition:opacity .15s;font-family:inherit}
.login-btn:hover{opacity:.9}
.login-error{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500}
.confirm-box{background:var(--white);border-radius:var(--radius-lg);padding:24px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow-md)}

/* COMISSÃO TABLE */
.com-row{display:grid;grid-template-columns:1fr 140px 110px 90px;gap:0;border-bottom:1px solid var(--border);align-items:center}
.com-row:last-child{border-bottom:none}
.com-cell{padding:10px 14px;font-size:13px}
.com-header{background:var(--bg);font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}

/* DETAIL PANEL */
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text2);font-weight:500}
.detail-val{font-weight:600;text-align:right}

/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  #sidebar{position:fixed;height:100vh;z-index:100}
  #sidebar.collapsed{width:0}
  .form-grid{grid-template-columns:1fr}
  .com-row{grid-template-columns:1fr 100px 80px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon">AH</div>
      <div class="login-title">AUTO HUB</div>
      <div class="login-sub">Gestão de Vendas</div>
    </div>
    <div class="login-field"><label>Usuário</label><input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username"></div>
    <div class="login-field"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password"></div>
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError">Usuário ou senha incorretos</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">AH</div>
      <div>
        <div class="brand-name">AUTO HUB</div>
        <div class="brand-sub">Gestão de Vendas</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-user">
      <div class="avatar" id="avatarEl">--</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--text)" id="userLabel"></div>
        <button onclick="fazerLogout()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0;font-family:inherit">Sair</button>
      </div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="toggleSidebar()" class="btn-icon" title="Menu">☰</button>
        <span class="topbar-title" id="pageTitle">Dashboard</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="todayDate"></span>
      </div>
    </div>
    <div id="content">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--text3)">
        <div class="spinner"></div>
        <span style="font-size:13px">Carregando...</span>
      </div>
    </div>
  </div>
</div>

<div id="notif"></div>

<script>
// ══ FIREBASE CONFIG ══
var FB_CFG={
  apiKey:"AIzaSyAlYPDKW9CVWO2c-hQCczqQ9ITClzCjImc",
  authDomain:"autohub-sistema-digital.firebaseapp.com",
  projectId:"autohub-sistema-digital",
  storageBucket:"autohub-sistema-digital.firebasestorage.app",
  messagingSenderId:"218267871676",
  appId:"1:218267871676:web:49061ac0b5d14047b523b9"
};
var TENANT="autohub_vendas";
// ══════════════════════

// ── USUÁRIOS ──
var USUARIOS={admin:"hub2026"};
var PERMISSOES_USUARIOS={};
var PERMISSOES_PADRAO=["dashboard","vendas","financeiro","comissoes","posvenda"];
var usuarioLogado=null,db=null;

// ── DADOS ──
var vendas=[],posvenda=[];
var modalSaveFn=null;
var currentTab="dashboard";

// ── COMISSÁRIOS FIXOS ──
var COMISSARIOS=["Auto Hub","Jota","Leo","Thaina","Alex","Victor","Jopa"];

// ── TABS ──
var TABS=[
  {id:"dashboard",label:"Dashboard",ico:"📊"},
  {id:"vendas",label:"Cadastro de Vendas",ico:"🚗"},
  {id:"financeiro",label:"Financeiro / Boletos",ico:"💰"},
  {id:"comissoes",label:"Controle de Comissões",ico:"💼"},
  {id:"posvenda",label:"Pós-venda",ico:"🔧"},
  {id:"usuarios",label:"Usuários",ico:"👤"}
];

var STATUS_VENDA=["Em Andamento","Concluída","Cancelada"];
var STATUS_BOLETO=["Pendente","Pago","Cancelado"];
var STATUS_PV=["Aberto","Em Atendimento","Resolvido","Cancelado"];
var TIPO_PV=["Reclamação","Dúvida","Documentação","Transferência","Revisão","Outro"];
var BR_STATES=["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
var LOJAS_INTERNAS=["TH Auto Repasse","Auto Hub"];

// ── UTILS ──
function col(c){return db.collection("tenants/"+TENANT+"/"+c);}
function today(){return new Date().toISOString().split("T")[0];}
function gv(id){var e=document.getElementById(id);return e?e.value:"";}
function gn(id){return Number((gv(id)||"").replace(/\./g,"").replace(",","."))||0;}
function fmtCur(v){return"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2});}
function fmtDate(d){if(!d)return"-";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function notify(msg,type){var el=document.getElementById("notif");el.textContent=(type==="err"?"✕ ":"✓ ")+msg;el.className="show "+(type||"ok");setTimeout(function(){el.className=""},3500);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("collapsed");}
function getUserPerms(u){if(u==="admin")return null;return PERMISSOES_USUARIOS[u]||PERMISSOES_PADRAO.slice();}
function hasTab(t){if(!usuarioLogado)return false;var p=getUserPerms(usuarioLogado);return p===null||p.indexOf(t)>=0;}

function formatMoedaInput(input){
  var v=input.value.replace(/\D/g,"");
  if(!v){input.value="";return;}
  v=parseInt(v,10);
  input.value=(v/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function getMoedaVal(id){
  var el=document.getElementById(id);
  if(!el)return 0;
  var v=(el.value||"").replace(/\./g,"").replace(",",".");
  return Number(v)||0;
}
function moedaInput(id){
  var el=document.getElementById(id);
  if(el)el.addEventListener("input",function(){formatMoedaInput(this);});
}

// ── LOGIN ──
function carregarUsuarios(){try{var s=localStorage.getItem("ah_u_"+TENANT);if(s){var o=JSON.parse(s);Object.keys(o).forEach(function(u){USUARIOS[u]=o[u];});}}catch(e){}}
function salvarUsuarios(){try{localStorage.setItem("ah_u_"+TENANT,JSON.stringify(USUARIOS));}catch(e){}}
function carregarPermissoes(){try{var s=localStorage.getItem("ah_p_"+TENANT);if(s)PERMISSOES_USUARIOS=JSON.parse(s);}catch(e){}}
function salvarPermissoes(){try{localStorage.setItem("ah_p_"+TENANT,JSON.stringify(PERMISSOES_USUARIOS));}catch(e){}}

carregarUsuarios();carregarPermissoes();

function fazerLogin(){
  var user=(gv("loginUser")||"").trim().toLowerCase();
  var pass=gv("loginPass")||"";
  if(!USUARIOS[user]||USUARIOS[user]!==pass){
    document.getElementById("loginError").style.display="block";
    return;
  }
  document.getElementById("loginError").style.display="none";
  usuarioLogado=user;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("userLabel").textContent=user;
  document.getElementById("avatarEl").textContent=user.slice(0,2).toUpperCase();
  document.getElementById("todayDate").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
  initFirebase();
  buildNav();
  navigateTo("dashboard");
}
function fazerLogout(){usuarioLogado=null;location.reload();}

// ── FIREBASE ──
function initFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
  db=firebase.firestore();
  loadData();
}
function loadData(){
  col("vendas").orderBy("dataCriacao","desc").onSnapshot(function(snap){
    vendas=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(currentTab==="dashboard"||currentTab==="vendas"||currentTab==="financeiro"||currentTab==="comissoes")render();
  });
  col("posvenda").orderBy("dataSolicitacao","desc").onSnapshot(function(snap){
    posvenda=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(currentTab==="posvenda")render();
  });
}

// ── NAV ──
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML="";
  TABS.forEach(function(t){
    if(!hasTab(t.id))return;
    var b=document.createElement("button");
    b.className="nav-btn"+(currentTab===t.id?" active":"");
    b.innerHTML='<span class="ico">'+t.ico+'</span><span>'+t.label+'</span>';
    b.onclick=function(){navigateTo(t.id);};
    nav.appendChild(b);
  });
}
function navigateTo(id){
  if(!hasTab(id))return;
  currentTab=id;
  var t=TABS.find(function(x){return x.id===id;});
  document.getElementById("pageTitle").textContent=t?t.label:"";
  buildNav();
  render();
}

// ══ RENDER PRINCIPAL ══
function render(){
  var c=document.getElementById("content");
  if(currentTab==="dashboard")c.innerHTML=renderDashboard();
  else if(currentTab==="vendas")c.innerHTML=renderVendas();
  else if(currentTab==="financeiro")c.innerHTML=renderFinanceiro();
  else if(currentTab==="comissoes")c.innerHTML=renderComissoes();
  else if(currentTab==="posvenda")c.innerHTML=renderPosvenda();
  else if(currentTab==="usuarios")c.innerHTML=renderUsuarios();
  bindActions();
}

// ══ DASHBOARD ══
function renderDashboard(){
  var total=vendas.length;
  var concluidas=vendas.filter(function(v){return v.statusVenda==="Concluída";}).length;
  var emAndamento=vendas.filter(function(v){return v.statusVenda==="Em Andamento";}).length;
  var totalVendas=vendas.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var boletosP=vendas.filter(function(v){return v.statusBoleto==="Pendente";}).length;
  var comissoesPendentes=0;
  vendas.forEach(function(v){
    COMISSARIOS.forEach(function(c){
      var key="com"+c.replace(/\s/g,"");
      var comData=v.comissoes&&v.comissoes[key];
      if(comData&&comData.valor>0&&!comData.pago)comissoesPendentes++;
    });
  });
  var pvAbertos=posvenda.filter(function(p){return p.statusPv==="Aberto";}).length;

  var h='<div class="cards-row">';
  h+='<div class="metric-card"><div class="metric-label">Total de Vendas</div><div class="metric-value">'+total+'</div><div class="metric-sub">'+concluidas+' concluídas · '+emAndamento+' em andamento</div></div>';

  h+='<div class="metric-card"><div class="metric-label">Boletos Pendentes</div><div class="metric-value" style="color:var(--yellow)">'+boletosP+'</div><div class="metric-sub">Aguardando pagamento</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Comissões Pendentes</div><div class="metric-value" style="color:var(--purple)">'+comissoesPendentes+'</div><div class="metric-sub">Items a pagar</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Pós-venda Abertos</div><div class="metric-value" style="color:var(--blue)">'+pvAbertos+'</div><div class="metric-sub">Solicitações abertas</div></div>';
  h+='</div>';

  // Vendas recentes
  h+='<div class="section-card"><div class="section-header"><span class="section-title">Vendas Recentes</span><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'vendas\')">Ver todas</button></div>';
  var recentes=vendas.slice(0,8);
  if(!recentes.length){h+='<div class="empty-state">Nenhuma venda cadastrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comprador</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody>';
    recentes.forEach(function(v){
      h+='<tr><td><strong>'+escHtml(v.placa||"-")+'</strong></td><td>'+escHtml(v.modelo||"-")+'</td><td>'+escHtml(v.nomeComprador||"-")+'</td><td>'+fmtCur(v.valorVenda)+'</td><td>'+badgeVenda(v.statusVenda)+'</td><td>'+fmtDate(v.dataVenda)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

function badgeVenda(s){
  if(s==="Concluída")return'<span class="badge badge-pago">'+escHtml(s)+'</span>';
  if(s==="Cancelada")return'<span class="badge badge-cancelado">'+escHtml(s)+'</span>';
  return'<span class="badge badge-pendente">'+(s||"Em Andamento")+'</span>';
}
function badgeBoleto(s){
  if(s==="Pago")return'<span class="badge badge-pago">Pago</span>';
  if(s==="Cancelado")return'<span class="badge badge-cancelado">Cancelado</span>';
  return'<span class="badge badge-pendente">Pendente</span>';
}
function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function salvarVenda(id){
  var placa=(gv("v_placa")||"").toUpperCase().trim();
  var modelo=(gv("v_modelo")||"").trim();
  var nomeComprador=(gv("v_nomeComprador")||"").trim();
  if(!placa||!modelo||!nomeComprador){notify("Preencha Placa, Modelo e Comprador","err");return;}

  var comissoes={};
  COMISSARIOS.forEach(function(c){
    var key="com"+c.replace(/\s/g,"");
    comissoes[key]={valor:getMoedaVal("cv_"+key),pago:gv("cp_"+key),dataPagamento:gv("cd_"+key)||null};
  });
  ["Taxa AutoHub (Plataforma)","Taxa Cliente (Plataforma)"].forEach(function(tx){
    var key="com"+tx.replace(/[\s()\/]/g,"");
    comissoes[key]={valor:getMoedaVal("cv_"+key),pago:gv("cp_"+key),dataPagamento:gv("cd_"+key)||null};
  });

  var data={
    loja:gv("v_loja"),dataVenda:gv("v_dataVenda"),placa:placa,modelo:modelo,
    localVeiculo:gv("v_localVeiculo"),vendedor:gv("v_vendedor"),
    nomeComprador:nomeComprador,nomeLoja:gv("v_nomeLoja"),uf:gv("v_uf"),
    telefone:gv("v_telefone"),cpfCnpj:gv("v_cpfCnpj"),
    valorVenda:getMoedaVal("v_valorVenda"),statusVenda:gv("v_statusVenda"),
    boletoEnviado:gv("v_boletoEnviado"),dataPagamento:gv("v_dataPagamento")||null,
    statusBoleto:gv("v_statusBoleto"),obs:gv("v_obs"),
    comissoes:comissoes
  };

  if(id){
    col("vendas").doc(id).update(data).then(function(){notify("Venda atualizada!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});
  }else{
    data.dataCriacao=today();
    col("vendas").add(data).then(function(){notify("Venda cadastrada!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});
  }
}

var comFiltro="Todos",comComissario="Todos";
function renderComissoes(){
  var h='<div class="section-card">';
  h+='<div class="section-header"><span class="section-title">Controle de Comissões</span>';
  h+='<button class="btn btn-secondary btn-sm" data-action="exportar-comissoes">⬇ Exportar CSV</button>';
  h+='</div>';
  h+='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h+='<select onchange="comComissario=this.value;render()" style="width:auto;min-width:160px"><option value="Todos">Todos os comissários</option>'+COMISSARIOS.concat(["Taxa AutoHub (Plataforma)","Taxa Cliente (Plataforma)"]).map(function(c){return'<option value="'+c+'"'+(comComissario===c?" selected":"")+">"+c+"</option>";}).join("")+'</select>';
  h+='<div class="filter-row">';
  ["Todos","Pendente","Pago"].forEach(function(s){
    h+='<button class="filter-tab'+(comFiltro===s?" active":"")+'\" onclick="comFiltro=\''+s+'\';render()">'+s+'</button>';
  });
  h+='</div></div>';

  // Montar linhas
  var linhas=[];
  var todosKeys=COMISSARIOS.map(function(c){return{label:c,key:"com"+c.replace(/\s/g,"")};})
    .concat([{label:"Taxa AutoHub (Plataforma)",key:"comTaxaAutoHubPlataforma"},{label:"Taxa Cliente (Plataforma)",key:"comTaxaClientePlataforma"}]);

  vendas.forEach(function(v){
    var comissoes=v.comissoes||{};
    todosKeys.forEach(function(x){
      var cd=comissoes[x.key]||{};
      if(!cd.valor)return;
      if(comComissario!=="Todos"&&comComissario!==x.label)return;
      var pago=cd.pago==="Sim";
      if(comFiltro==="Pago"&&!pago)return;
      if(comFiltro==="Pendente"&&pago)return;
      linhas.push({venda:v,comissario:x.label,chave:x.key,valor:cd.valor,pago:pago,dataPagamento:cd.dataPagamento});
    });
  });

  // Totais
  var totalG=linhas.reduce(function(a,l){return a+Number(l.valor||0);},0);
  var totalP=linhas.filter(function(l){return l.pago;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var totalPend=totalG-totalP;

  h+='<div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap">';
  h+='<div><div style="font-size:11px;color:var(--text2);margin-bottom:2px">Total</div><div style="font-size:16px;font-weight:700">'+fmtCur(totalG)+'</div></div>';
  h+='<div><div style="font-size:11px;color:var(--text2);margin-bottom:2px">Pago</div><div style="font-size:16px;font-weight:700;color:var(--green)">'+fmtCur(totalP)+'</div></div>';
  h+='<div><div style="font-size:11px;color:var(--text2);margin-bottom:2px">Pendente</div><div style="font-size:16px;font-weight:700;color:var(--yellow)">'+fmtCur(totalPend)+'</div></div>';
  h+='</div>';

  if(!linhas.length){h+='<div class="empty-state">Nenhuma comissão encontrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comissário</th><th>Valor</th><th>Status</th><th>Data Pgto</th><th>Ação</th></tr></thead><tbody>';
    linhas.forEach(function(l){
      h+='<tr>';
      h+='<td><strong>'+escHtml(l.venda.placa||"-")+'</strong></td>';
      h+='<td>'+escHtml(l.venda.modelo||"-")+'</td>';
      h+='<td><span class="badge badge-blue">'+escHtml(l.comissario)+'</span></td>';
      h+='<td><strong>'+fmtCur(l.valor)+'</strong></td>';
      h+='<td>'+(l.pago?'<span class="badge badge-pago">Pago</span>':'<span class="badge badge-pendente">Pendente</span>')+'</td>';
      h+='<td>'+fmtDate(l.dataPagamento)+'</td>';
      h+='<td><button class="btn-icon" data-action="toggle-comissao" data-vendaid="'+l.venda.id+'" data-chave="'+l.chave+'" data-pago="'+(l.pago?"Sim":"Não")+'" title="'+(l.pago?"Marcar Pendente":"Marcar Pago")+'\">'+(l.pago?"↩":"✓")+'</button></td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<div style="padding:10px 16px;color:var(--text3);font-size:12px">'+linhas.length+' item(s)</div>';
  h+='</div>';
  return h;
}

function toggleComissao(vendaId,chave,atualPago){
  var v=vendas.find(function(x){return x.id===vendaId;});
  if(!v)return;
  var comissoes=v.comissoes||{};
  var cd=comissoes[chave]||{};
  var novoPago=atualPago==="Sim"?"Não":"Sim";
  cd.pago=novoPago;
  if(novoPago==="Sim"&&!cd.dataPagamento)cd.dataPagamento=today();
  comissoes[chave]=cd;
  col("vendas").doc(vendaId).update({comissoes:comissoes})
    .then(function(){notify(novoPago==="Sim"?"Marcado como pago!":"Marcado como pendente");})
    .catch(function(e){notify("Erro: "+e.message,"err");});
}

function exportarComissoes(){
  var todosKeys=COMISSARIOS.map(function(c){return{label:c,key:"com"+c.replace(/\s/g,"")};})
    .concat([{label:"Taxa AutoHub (Plataforma)",key:"comTaxaAutoHubPlataforma"},{label:"Taxa Cliente (Plataforma)",key:"comTaxaClientePlataforma"}]);
  var rows=[["Placa","Modelo","Comprador","Comissário","Valor","Status","Data Pagamento"]];
  vendas.forEach(function(v){
    var comissoes=v.comissoes||{};
    todosKeys.forEach(function(x){
      var cd=comissoes[x.key]||{};
      if(!cd.valor)return;
      rows.push([v.placa||"",v.modelo||"",v.nomeComprador||"",x.label,Number(cd.valor||0).toFixed(2),cd.pago==="Sim"?"Pago":"Pendente",cd.dataPagamento||""]);
    });
  });
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="comissoes_autohub.csv";a.click();
  URL.revokeObjectURL(url);
  notify("CSV exportado!");
}

function novoUsuario(){
  showModal("Adicionar Usuário",'<div class="form-grid"><div class="field"><label class="field-label">Usuário</label><input id="nu_user" placeholder="Ex: operador1"></div><div class="field"><label class="field-label">Senha</label><input type="password" id="nu_pass"></div><div class="field"><label class="field-label">Confirmar Senha</label><input type="password" id="nu_pass2"></div></div>',function(){
    var u=(gv("nu_user")||"").trim().toLowerCase();
    var p=gv("nu_pass");var p2=gv("nu_pass2");
    if(!u||u.length<3){notify("Usuário com mín. 3 caracteres","err");return;}
    if(USUARIOS[u]){notify("Usuário já existe","err");return;}

function trocarSenha(user){
  var isMe=user===usuarioLogado;
  var h='<div class="form-grid">'+(isMe?'<div class="field full"><label class="field-label">Senha Atual</label><input type="password" id="ap_atual"></div>':"")+

    '<div class="field full"><label class="field-label">Confirmar Nova Senha</label><input type="password" id="ap_conf"></div></div>';
  showModal("Alterar Senha — "+user,h,function(){
    if(isMe){var a=gv("ap_atual");if(a!==USUARIOS[user]){notify("Senha atual incorreta","err");return;}}

    USUARIOS[user]=n;salvarUsuarios();notify("Senha alterada!");closeModal();
  });
}
function permUser(user){
  var perms=PERMISSOES_USUARIOS[user]||PERMISSOES_PADRAO.slice();
  var abas=TABS.filter(function(t){return t.id!=="usuarios";});
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  abas.forEach(function(t){

  });
  h+='</div>';
  showModal("Permissões — "+user,h,function(){
    var novas=abas.filter(function(t){var el=document.getElementById("perm_"+t.id);return el&&el.checked;}).map(function(t){return t.id;});
    PERMISSOES_USUARIOS[user]=novas;salvarPermissoes();notify("Permissões atualizadas!");closeModal();render();
  });
}
function delUser(user){
  if(user==="admin"||user===usuarioLogado){notify("Não é possível remover este usuário","err");return;}
  confirmDlg("Remover Usuário","Deseja remover \""+user+"\"?",function(){
    delete USUARIOS[user];salvarUsuarios();notify("Usuário removido");render();
  });
}

// ══ MODAL ══
function showModal(title,body,saveFn,soView){
  modalSaveFn=saveFn||null;
  var ov=document.createElement("div");ov.className="overlay";ov.id="modalOverlay";
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="modal-header"><span class="modal-title">'+title+'</span><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">'+body+'</div>'+
    (!soView?'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="modalSaveBtn">Salvar</button></div>':'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Fechar</button></div>');
  ov.appendChild(m);
  ov.onclick=function(e){if(e.target===ov)closeModal();};
  document.body.appendChild(ov);
  if(saveFn)document.getElementById("modalSaveBtn").onclick=saveFn;
}
function closeModal(){var ov=document.getElementById("modalOverlay");if(ov)ov.remove();}

function confirmDlg(title,msg,fn){
  var ov=document.createElement("div");ov.className="confirm-overlay";ov.id="confirmOverlay";
  var b=document.createElement("div");b.className="confirm-box";
  b.innerHTML='<div style="font-size:24px;margin-bottom:8px">⚠️</div><h3 style="margin-bottom:8px">'+title+'</h3><p style="color:var(--text2);font-size:13px;margin-bottom:20px">'+msg+'</p><div style="display:flex;gap:8px;justify-content:center"></div>';
  var btnC=document.createElement("button");btnC.className="btn btn-secondary";btnC.textContent="Cancelar";btnC.onclick=function(){ov.remove();};
  var btnO=document.createElement("button");btnO.className="btn btn-danger";btnO.textContent="Confirmar";btnO.onclick=function(){ov.remove();fn();};
  b.querySelector("div:last-child").appendChild(btnC);b.querySelector("div:last-child").appendChild(btnO);
  ov.appendChild(b);document.body.appendChild(ov);
}

// ══ EVENT DELEGATION ══
function bindActions(){
  document.getElementById("content").onclick=function(e){
    var el=e.target.closest("[data-action]");
    if(!el)return;
    var action=el.getAttribute("data-action");
    var id=el.getAttribute("data-id");
    if(action==="nova-venda")abrirModalVenda(null);
    else if(action==="editar-venda")abrirModalVenda(id);
    else if(action==="ver-venda")verVenda(id);
    else if(action==="excluir-venda")excluirVenda(id);
    else if(action==="editar-boleto")abrirModalBoleto(id);
    else if(action==="novo-pv")abrirModalPv(null);
    else if(action==="editar-pv")abrirModalPv(id);
    else if(action==="excluir-pv")excluirPv(id);
    else if(action==="exportar-comissoes")exportarComissoes();
    else if(action==="toggle-comissao")toggleComissao(el.getAttribute("data-vendaid"),el.getAttribute("data-chave"),el.getAttribute("data-pago"));
    else if(action==="novo-usuario")novoUsuario();
    else if(action==="trocar-senha")trocarSenha(id);
    else if(action==="trocar-senha-me")trocarSenha(usuarioLogado);
    else if(action==="perm-user")permUser(id);
    else if(action==="del-user")delUser(id);
  };
}
