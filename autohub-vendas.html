<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO HUB | Sistema de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--blue-dark:#1D4ED8;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --orange:#EA580C;--orange-bg:#FFF7ED;--orange-border:#FED7AA;
  --gray-bg:#F3F4F6;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.brand-name{font-size:13px;font-weight:700;color:var(--text)}
.brand-sub{font-size:10px;color:var(--text3)}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-sec{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;width:100%;text-align:left;transition:all .12s;font-family:inherit;white-space:nowrap}
.nav-btn:hover{background:var(--blue-light);color:var(--blue)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-user{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue-dark);flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.metric-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px}
.metric-value{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* SECTION */
.section-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.section-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.section-title{font-size:14px;font-weight:600}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.empty-state{padding:40px;text-align:center;color:var(--text3);font-size:13px}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-blue{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.badge-orange{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.badge-gray{background:var(--gray-bg);color:var(--text2);border:1px solid var(--border)}
/* BTN */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{opacity:.88}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--border2)}
.btn-secondary:hover{background:var(--gray-bg)}
.btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:5px 7px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;line-height:1}
.btn-icon:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}
/* FILTER */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-tab{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;font-family:inherit}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* SEARCH */
.search-wrap{position:relative}
.search-wrap input{padding-left:32px;min-width:200px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
/* FORM */
input,select,textarea{background:var(--white);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column}
.field.full{grid-column:1/-1}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-lg{max-width:800px}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--gray-bg)}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
/* SECTION DIVIDER IN FORM */
.form-section{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;grid-column:1/-1}
/* NOTIFY */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-weight:500;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:320px;box-shadow:var(--shadow-md)}
#notif.show{opacity:1}
#notif.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#notif.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.login-logo{text-align:center;margin-bottom:28px}
.login-icon{width:60px;height:60px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 12px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.login-field input{font-size:14px;padding:11px 14px}
.login-btn{width:100%;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px;font-family:inherit}
.login-btn:hover{opacity:.9}
.login-error{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}
/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500}
.confirm-box{background:var(--white);border-radius:var(--radius-lg);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow-md)}
/* DRE */
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:3px}
.dre-group{font-weight:700;background:var(--blue-light);color:var(--blue-dark);margin-top:10px}
.dre-total{font-weight:700;font-size:15px;background:var(--green-bg);color:var(--green);margin-top:6px;padding:12px 14px}
.dre-total-neg{font-weight:700;font-size:15px;background:var(--red-bg);color:var(--red);margin-top:6px;padding:12px 14px}
.dre-sub{color:var(--text2)}
/* RELATORIOS TABS */
.rel-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.rel-tab{padding:10px 20px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit}
.rel-tab.active-vendas{color:#2563EB;border-bottom-color:#2563EB}
.rel-tab.active-financeiro{color:#16A34A;border-bottom-color:#16A34A}
.rel-tab.active-comissoes{color:#7C3AED;border-bottom-color:#7C3AED}
.rel-tab.active-dre{color:#D97706;border-bottom-color:#D97706}
/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* DETAIL */
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text2);font-weight:500}
/* CONFIG LIST */
.config-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--white)}
.config-item span{font-size:13px;font-weight:500}
/* TOTALS BAR */
.totals-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap}
.total-item{display:flex;flex-direction:column;gap:2px}
.total-label{font-size:11px;color:var(--text2);font-weight:500}
.total-val{font-size:16px;font-weight:700}
@media(max-width:640px){
  #sidebar{position:fixed;height:100vh;z-index:100}
  .form-grid{grid-template-columns:1fr}
  .cards-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon">AH</div>
      <div style="font-size:20px;font-weight:700">AUTO HUB</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">Sistema de Gestão</div>
    </div>
    <div class="login-field"><label>Usuário</label><input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username"></div>
    <div class="login-field"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password"></div>
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError">Usuário ou senha incorretos</div>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">AH</div>
      <div><div class="brand-name">AUTO HUB</div><div class="brand-sub">Gestão Empresarial</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-user">
      <div class="avatar" id="avatarEl">--</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--text)" id="userLabel"></div>
        <button onclick="fazerLogout()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0;font-family:inherit">Sair</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="toggleSidebar()" class="btn-icon" title="Menu">☰</button>
        <span class="topbar-title" id="pageTitle">Dashboard</span>
      </div>
      <span style="font-size:12px;color:var(--text3)" id="todayDate"></span>
    </div>
    <div id="content">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--text3)">
        <div class="spinner"></div><span style="font-size:13px">Carregando...</span>
      </div>
    </div>
  </div>
</div>
<div id="notif"></div>

<script>
// ══ FIREBASE ══
var FB={apiKey:"AIzaSyAlYPDKW9CVWO2c-hQCczqQ9ITClzCjImc",authDomain:"autohub-sistema-digital.firebaseapp.com",projectId:"autohub-sistema-digital",storageBucket:"autohub-sistema-digital.firebasestorage.app",messagingSenderId:"218267871676",appId:"1:218267871676:web:49061ac0b5d14047b523b9"};
var TENANT="autohub_vendas";

// ══ CATEGORIAS FINANCEIRO ══
var CATS_FIN=[
  {key:"venda_de_carros",label:"Venda de Carros",tipo:"receita"},
  {key:"comissao",label:"Comissão",tipo:"despesa"},
  {key:"marketing",label:"Marketing",tipo:"despesa"},
  {key:"outros",label:"Outros",tipo:"despesa"},
  {key:"compra_de_carros",label:"Compra de Carros",tipo:"despesa"},
  {key:"saldo_cdb",label:"Saldo CDB - Ajuste de Abertura",tipo:"receita"},
  {key:"fixo",label:"Custo Fixo",tipo:"despesa"},
  {key:"imposto",label:"Imposto",tipo:"despesa"},
  {key:"preparacao",label:"Preparação/Mecânica",tipo:"despesa"},
  {key:"contabilidade",label:"Contabilidade",tipo:"despesa"},
  {key:"aluguel",label:"Aluguel",tipo:"despesa"},
  {key:"documentacao",label:"Documentação",tipo:"despesa"}
];
var CATS_DRE_EXCLUIR=["venda_de_carros","compra_de_carros","saldo_cdb"];

// ══ ESTADO ══
var usuarioLogado=null,db=null,currentTab="dashboard";
var USUARIOS={admin:"hub2026"};
var PERMISSOES_USUARIOS={};
var PERMISSOES_PADRAO=["dashboard","vendas","financeiro","relatorios","posvenda"];
var vendas=[],lancamentos=[],posvenda=[],config={};
var vendasFiltro="",vendasStatus="Todos";
var finFiltro="Todos",finCat="Todas",finSearch="";
var pvFiltro="Todos",pvSearch="";
var relTab="vendas";
var dreInicio="",dreFim="";

var TABS=[
  {id:"dashboard",label:"Dashboard",ico:"📊"},
  {id:"vendas",label:"Cadastro de Vendas",ico:"🚗"},
  {id:"financeiro",label:"Financeiro",ico:"💰"},
  {id:"relatorios",label:"Relatórios & DRE",ico:"📈"},
  {id:"posvenda",label:"Pós-venda",ico:"🔧"},
  {id:"configuracoes",label:"Configurações",ico:"⚙️"},
  {id:"usuarios",label:"Usuários",ico:"👤"}
];

var STATUS_VENDA=["Em Andamento","Concluída","Cancelada"];
var STATUS_BOLETO=["Pendente","Pago","Cancelado"];
var STATUS_PV=["Aberto","Em Atendimento","Resolvido","Cancelado"];
var BR_STATES=["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

// ══ UTILS ══
function col(c){return db.collection("tenants/"+TENANT+"/"+c);}
function today(){return new Date().toISOString().split("T")[0];}
function gv(id){var e=document.getElementById(id);return e?e.value:"";}
function fmtCur(v){return"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2});}
function fmtDate(d){if(!d)return"-";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function notify(msg,type){var el=document.getElementById("notif");el.textContent=(type==="err"?"✕ ":"✓ ")+msg;el.className="show "+(type||"ok");setTimeout(function(){el.className=""},3500);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("collapsed");}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getUserPerms(u){if(u==="admin")return null;return PERMISSOES_USUARIOS[u]||PERMISSOES_PADRAO.slice();}
function hasTab(t){if(!usuarioLogado)return false;var p=getUserPerms(usuarioLogado);return p===null||p.indexOf(t)>=0;}
function moedaInput(id){var el=document.getElementById(id);if(el)el.addEventListener("input",function(){var v=this.value.replace(/\D/g,"");if(!v){this.value="";return;}this.value=(parseInt(v,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});});}
function getMoedaVal(id){var el=document.getElementById(id);if(!el)return 0;return Number((el.value||"").replace(/\./g,"").replace(",","."))||0;}
function catLabel(key){var c=CATS_FIN.find(function(x){return x.key===key;});return c?c.label:key;}
function catTipo(key){var c=CATS_FIN.find(function(x){return x.key===key;});return c?c.tipo:"despesa";}
function getVendedores(){return(config.vendedores||[]);}
function getComissarios(){return(config.comissarios||[]);}
function getTiposReclamacao(){return(config.tiposReclamacao||["Reclamação","Dúvida","Documentação","Transferência","Revisão","Outro"]);}

// ══ LOGIN ══
function carregarUsuarios(){try{var s=localStorage.getItem("ah_u_"+TENANT);if(s)Object.assign(USUARIOS,JSON.parse(s));}catch(e){}}
function salvarUsuarios(){try{localStorage.setItem("ah_u_"+TENANT,JSON.stringify(USUARIOS));}catch(e){}}
function carregarPermissoes(){try{var s=localStorage.getItem("ah_p_"+TENANT);if(s)PERMISSOES_USUARIOS=JSON.parse(s);}catch(e){}}
function salvarPermissoes(){try{localStorage.setItem("ah_p_"+TENANT,JSON.stringify(PERMISSOES_USUARIOS));}catch(e){}}
carregarUsuarios();carregarPermissoes();

function fazerLogin(){
  var user=(gv("loginUser")||"").trim().toLowerCase();
  var pass=gv("loginPass")||"";
  if(!USUARIOS[user]||USUARIOS[user]!==pass){document.getElementById("loginError").style.display="block";return;}
  document.getElementById("loginError").style.display="none";
  usuarioLogado=user;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("userLabel").textContent=user;
  document.getElementById("avatarEl").textContent=user.slice(0,2).toUpperCase();
  document.getElementById("todayDate").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
  initFirebase();buildNav();navigateTo("dashboard");
}
function fazerLogout(){usuarioLogado=null;location.reload();}

// ══ FIREBASE ══
function initFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.firestore();
  col("vendas").orderBy("dataCriacao","desc").onSnapshot(function(snap){vendas=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(["dashboard","vendas","relatorios"].indexOf(currentTab)>=0)render();});
  col("lancamentos").orderBy("data","desc").onSnapshot(function(snap){lancamentos=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(["dashboard","financeiro","relatorios"].indexOf(currentTab)>=0)render();});
  col("posvenda").orderBy("dataSolicitacao","desc").onSnapshot(function(snap){posvenda=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(currentTab==="posvenda")render();});
  col("config").doc("main").onSnapshot(function(snap){if(snap.exists)config=snap.data();if(currentTab==="configuracoes")render();});
}
function salvarConfig(){return col("config").doc("main").set(config);}

// ══ NAV ══
function buildNav(){
  var nav=document.getElementById("nav");nav.innerHTML="";
  TABS.forEach(function(t){
    if(!hasTab(t.id))return;
    var b=document.createElement("button");
    b.className="nav-btn"+(currentTab===t.id?" active":"");
    b.innerHTML='<span style="font-size:15px">'+t.ico+'</span><span>'+t.label+'</span>';
    b.onclick=function(){navigateTo(t.id);};
    nav.appendChild(b);
  });
}
function navigateTo(id){
  if(!hasTab(id))return;
  currentTab=id;
  document.getElementById("pageTitle").textContent=(TABS.find(function(x){return x.id===id;})||{label:""}).label;
  buildNav();render();
}

// ══ RENDER ══
function render(){
  var c=document.getElementById("content");
  if(currentTab==="dashboard")c.innerHTML=renderDashboard();
  else if(currentTab==="vendas")c.innerHTML=renderVendas();
  else if(currentTab==="financeiro")c.innerHTML=renderFinanceiro();
  else if(currentTab==="relatorios")c.innerHTML=renderRelatorios();
  else if(currentTab==="posvenda")c.innerHTML=renderPosvenda();
  else if(currentTab==="configuracoes")c.innerHTML=renderConfiguracoes();
  else if(currentTab==="usuarios")c.innerHTML=renderUsuarios();
  bindActions();
}

function renderDashboard(){
  var totalVendas=vendas.length;
  var concluidas=vendas.filter(function(v){return v.statusVenda==="Concluída";}).length;
  var volumeVendas=vendas.filter(function(v){return v.statusVenda!=="Cancelada";}).reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var custosTotal=vendas.filter(function(v){return v.statusVenda!=="Cancelada";}).reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var margemTotal=volumeVendas-custosTotal;
  var boletosP=vendas.filter(function(v){return(v.statusBoleto||"Pendente")==="Pendente"&&v.statusVenda!=="Cancelada";}).length;
  var pvAbertos=posvenda.filter(function(p){return p.statusPv==="Aberto";}).length;
  var despesasMes=lancamentos.filter(function(l){return l.data&&l.data.slice(0,7)===today().slice(0,7)&&catTipo(l.categoria)==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);

  var h='<div class="cards-row">';
  h+='<div class="metric-card"><div class="metric-label">Total de Vendas</div><div class="metric-value">'+totalVendas+'</div><div class="metric-sub">'+concluidas+' concluídas</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Volume de Vendas</div><div class="metric-value" style="font-size:17px">'+fmtCur(volumeVendas)+'</div><div class="metric-sub">Valor total vendido</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Margem Bruta</div><div class="metric-value" style="font-size:17px;color:var(--green)">'+fmtCur(margemTotal)+'</div><div class="metric-sub">Vendas − Custo dos veículos</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Boletos Pendentes</div><div class="metric-value" style="color:var(--yellow)">'+boletosP+'</div><div class="metric-sub">Aguardando pagamento</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Despesas do Mês</div><div class="metric-value" style="font-size:17px;color:var(--red)">'+fmtCur(despesasMes)+'</div><div class="metric-sub">Lançamentos este mês</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Pós-venda Abertos</div><div class="metric-value" style="color:var(--blue)">'+pvAbertos+'</div><div class="metric-sub">Solicitações em aberto</div></div>';
  h+='</div>';

  h+='<div class="section-card"><div class="section-header"><span class="section-title">Últimas Vendas</span><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'vendas\')">Ver todas →</button></div>';
  var rec=vendas.slice(0,6);
  if(!rec.length){h+='<div class="empty-state">Nenhuma venda cadastrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Comprador</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Status</th></tr></thead><tbody>';
    rec.forEach(function(v){
      var margem=Number(v.valorVenda||0)-Number(v.valorCusto||0);
      h+='<tr><td><strong>'+escH(v.placa||"-")+'</strong></td><td>'+escH(v.modelo||"-")+'</td><td>'+escH(v.nomeComprador||"-")+'</td><td>'+fmtCur(v.valorCusto)+'</td><td><strong>'+fmtCur(v.valorVenda)+'</strong></td><td style="color:'+(margem>=0?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(margem)+'</strong></td><td>'+badgeVenda(v.statusVenda)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

function badgeVenda(s){
  if(s==="Concluída")return'<span class="badge badge-green">'+escH(s)+'</span>';
  if(s==="Cancelada")return'<span class="badge badge-red">'+escH(s)+'</span>';
  return'<span class="badge badge-yellow">'+(s||"Em Andamento")+'</span>';
}
function badgeBoleto(s){
  if(s==="Pago")return'<span class="badge badge-green">Pago</span>';
  if(s==="Cancelado")return'<span class="badge badge-red">Cancelado</span>';
  return'<span class="badge badge-yellow">Pendente</span>';
}

function salvarVenda(id){
  var placa=(gv("v_placa")||"").toUpperCase().trim();
  var modelo=(gv("v_modelo")||"").trim();
  var nomeComprador=(gv("v_nomeComprador")||"").trim();
  if(!placa||!modelo||!nomeComprador){notify("Preencha Placa, Modelo e Comprador","err");return;}
  var data={loja:"AUTO HUB",dataVenda:gv("v_dataVenda"),placa:placa,modelo:modelo,localVeiculo:gv("v_localVeiculo"),vendedor:gv("v_vendedor"),valorCusto:getMoedaVal("v_valorCusto"),valorVenda:getMoedaVal("v_valorVenda"),statusVenda:gv("v_statusVenda"),boletoEnviado:gv("v_boletoEnviado"),statusBoleto:gv("v_statusBoleto"),dataPagamento:gv("v_dataPagamento")||null,nomeComprador:nomeComprador,nomeLoja:gv("v_nomeLoja"),uf:gv("v_uf"),telefone:gv("v_telefone"),cpfCnpj:gv("v_cpfCnpj"),obs:gv("v_obs")};
  if(id){col("vendas").doc(id).update(data).then(function(){notify("Venda atualizada!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
  else{data.dataCriacao=today();col("vendas").add(data).then(function(){notify("Venda cadastrada!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
}

function verVenda(id){

function abrirModalLancamento(id){
  var l=id?(lancamentos.find(function(x){return x.id===id;})||{}):{};
  var placas=vendas.map(function(v){return v.placa;}).filter(function(p,i,a){return p&&a.indexOf(p)===i;});
  var comissarios=getComissarios();
  var h='<div class="form-grid">';
  h+='<div class="field"><label class="field-label">Data *</label><input type="date" id="l_data" value="'+(l.data||today())+'"></div>';
  h+='<div class="field"><label class="field-label">Categoria *</label><select id="l_categoria" onchange="atualizarTipoLanc()"><option value="">Selecione</option>'+CATS_FIN.map(function(c){return'<option value="'+c.key+'"'+(l.categoria===c.key?" selected":"")+">"+c.label+"</option>";}).join("")+'</select></div>';
  h+='<div class="field full"><label class="field-label">Descrição</label><input id="l_descricao" value="'+escH(l.descricao||"")+'" placeholder="Descreva o lançamento"></div>';
  h+='<div class="field"><label class="field-label">Valor (R$) *</label><input id="l_valor" value="'+(l.valor?Number(l.valor).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'\" placeholder="0,00"></div>';
  h+='<div class="field"><label class="field-label">Placa Vinculada</label><select id="l_placa"><option value="">Nenhuma</option>'+placas.map(function(p){return'<option value="'+escH(p)+'"'+(l.placa===p?" selected":"")+">"+escH(p)+"</option>";}).join("")+'</select></div>';
  h+='<div class="field"><label class="field-label">Comissário Vinculado</label><select id="l_comissario"><option value="">Nenhum</option>'+comissarios.map(function(c){return'<option value="'+escH(c)+'"'+(l.comissario===c?" selected":"")+">"+escH(c)+"</option>";}).join("")+'</select></div>';
  h+='<div class="field full"><label class="field-label">Observações</label><textarea id="l_obs">'+escH(l.obs||"")+'</textarea></div>';
  h+='</div>';
  showModal((id?"Editar Lançamento":"Novo Lançamento"),h,function(){salvarLancamento(id);},"modal");
  moedaInput("l_valor");
}

function salvarLancamento(id){
  var cat=gv("l_categoria");var valor=getMoedaVal("l_valor");
  if(!cat||!valor){notify("Preencha categoria e valor","err");return;}
  var data={data:gv("l_data"),categoria:cat,descricao:gv("l_descricao"),valor:valor,placa:gv("l_placa")||null,comissario:gv("l_comissario")||null,obs:gv("l_obs")};
  if(id){col("lancamentos").doc(id).update(data).then(function(){notify("Atualizado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
  else{data.dataCriacao=today();col("lancamentos").add(data).then(function(){notify("Lançamento salvo!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
}

function excluirLancamento(id){
  confirmDlg("Excluir Lançamento","Tem certeza?",function(){col("lancamentos").doc(id).delete().then(function(){notify("Excluído");}).catch(function(e){notify("Erro: "+e.message,"err");});});
}

function renderRelatorios(){
  var tabsConf=[
    {id:"vendas",label:"Vendas",cor:"#2563EB"},
    {id:"financeiro",label:"Financeiro",cor:"#16A34A"},
    {id:"comissoes",label:"Comissões",cor:"#7C3AED"},
    {id:"dre",label:"DRE",cor:"#D97706"}
  ];
  var h='<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 0">';
  h+='<div class="rel-tabs">';
  tabsConf.forEach(function(t){
    var isAct=relTab===t.id;
    h+='<button class="rel-tab'+(isAct?" active-"+t.id:"")+'\" onclick="relTab=\''+t.id+'\';render()" style="'+(isAct?"color:"+t.cor+";border-bottom-color:"+t.cor:"")+'">'+t.label+'</button>';
  });
  h+='</div></div>';
  h+='<div style="margin-top:16px">';
  if(relTab==="vendas")h+=relVendas();
  else if(relTab==="financeiro")h+=relFinanceiro();
  else if(relTab==="comissoes")h+=relComissoes();
  else if(relTab==="dre")h+=relDRE();
  h+='</div>';
  return h;
}

function relVendas(){
  var concluidas=vendas.filter(function(v){return v.statusVenda==="Concluída";});
  var tVenda=concluidas.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var tCusto=concluidas.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var tMargem=tVenda-tCusto;
  var pctMargem=tVenda>0?((tMargem/tVenda)*100).toFixed(1):0;

  var h='<div class="cards-row" style="margin-bottom:16px">';
  h+='<div class="metric-card"><div class="metric-label">Vendas Concluídas</div><div class="metric-value" style="color:#2563EB">'+concluidas.length+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Volume Total</div><div class="metric-value" style="font-size:16px">'+fmtCur(tVenda)+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Custo Total</div><div class="metric-value" style="font-size:16px;color:var(--red)">'+fmtCur(tCusto)+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Margem Bruta</div><div class="metric-value" style="font-size:16px;color:var(--green)">'+fmtCur(tMargem)+'</div><div class="metric-sub">'+pctMargem+'% sobre vendas</div></div>';
  h+='</div>';

  // Por Vendedor
  var porVendedor={};
  concluidas.forEach(function(v){var vend=v.vendedor||"Sem vendedor";if(!porVendedor[vend])porVendedor[vend]={qtd:0,volume:0,custo:0};porVendedor[vend].qtd++;porVendedor[vend].volume+=Number(v.valorVenda||0);porVendedor[vend].custo+=Number(v.valorCusto||0);});
  h+='<div class="section-card"><div class="section-header" style="background:var(--blue-light)"><span class="section-title" style="color:var(--blue)">📊 Desempenho por Vendedor</span></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Vendedor</th><th>Qtd. Vendas</th><th>Volume</th><th>Custo</th><th>Margem</th><th>% Margem</th></tr></thead><tbody>';
  Object.keys(porVendedor).sort().forEach(function(v){
    var d=porVendedor[v];var m=d.volume-d.custo;var pct=d.volume>0?((m/d.volume)*100).toFixed(1):0;
    h+='<tr><td><strong>'+escH(v)+'</strong></td><td>'+d.qtd+'</td><td>'+fmtCur(d.volume)+'</td><td>'+fmtCur(d.custo)+'</td><td style="color:'+(m>=0?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(m)+'</strong></td><td><span class="badge '+(m>=0?"badge-green":"badge-red")+'">'+pct+'%</span></td></tr>';
  });
  if(!Object.keys(porVendedor).length)h+='<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">Sem dados</td></tr>';
  h+='</tbody></table></div></div>';

  // Por UF
  var porUF={};
  concluidas.forEach(function(v){var uf=v.uf||"-";if(!porUF[uf])porUF[uf]={qtd:0,volume:0};porUF[uf].qtd++;porUF[uf].volume+=Number(v.valorVenda||0);});
  h+='<div class="section-card" style="margin-top:0"><div class="section-header" style="background:var(--blue-light)"><span class="section-title" style="color:var(--blue)">🗺️ Vendas por UF</span></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>UF</th><th>Qtd</th><th>Volume</th></tr></thead><tbody>';
  Object.keys(porUF).sort().forEach(function(uf){var d=porUF[uf];h+='<tr><td><span class="badge badge-blue">'+escH(uf)+'</span></td><td>'+d.qtd+'</td><td>'+fmtCur(d.volume)+'</td></tr>';});
  if(!Object.keys(porUF).length)h+='<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:20px">Sem dados</td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

function relFinanceiro(){
  var porCat={};
  lancamentos.forEach(function(l){var k=l.categoria||"outros";if(!porCat[k])porCat[k]={receita:0,despesa:0,qtd:0};porCat[k].qtd++;if(catTipo(k)==="receita")porCat[k].receita+=Number(l.valor||0);else porCat[k].despesa+=Number(l.valor||0);});
  var tRec=lancamentos.filter(function(l){return catTipo(l.categoria)==="receita";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var tDes=lancamentos.filter(function(l){return catTipo(l.categoria)==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);

  var h='<div class="cards-row" style="margin-bottom:16px">';
  h+='<div class="metric-card"><div class="metric-label">Total Receitas</div><div class="metric-value" style="color:var(--green);font-size:16px">'+fmtCur(tRec)+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Total Despesas</div><div class="metric-value" style="color:var(--red);font-size:16px">'+fmtCur(tDes)+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Saldo</div><div class="metric-value" style="color:'+(tRec-tDes>=0?"var(--green)":"var(--red)")+'";font-size:16px">'+fmtCur(tRec-tDes)+'</div></div>';
  h+='</div>';

  h+='<div class="section-card"><div class="section-header" style="background:var(--green-bg)"><span class="section-title" style="color:var(--green)">💰 Lançamentos por Categoria</span></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Categoria</th><th>Tipo</th><th>Qtd</th><th>Valor</th></tr></thead><tbody>';
  CATS_FIN.forEach(function(c){
    var d=porCat[c.key];if(!d)return;
    var val=d.receita||d.despesa;
    h+='<tr><td><strong>'+escH(c.label)+'</strong></td><td><span class="badge '+(c.tipo==="receita"?"badge-green":"badge-orange")+'">'+c.tipo+'</span></td><td>'+d.qtd+'</td><td style="color:'+(c.tipo==="receita"?"var(--green)":"var(--red)")+'"><strong>'+fmtCur(val)+'</strong></td></tr>';
  });
  if(!Object.keys(porCat).length)h+='<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:20px">Sem lançamentos</td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

function relComissoes(){
  var porComissario={};
  lancamentos.filter(function(l){return l.categoria==="comissao"&&l.comissario;}).forEach(function(l){
    var c=l.comissario;if(!porComissario[c])porComissario[c]={total:0,qtd:0};
    porComissario[c].total+=Number(l.valor||0);porComissario[c].qtd++;
  });
  var total=lancamentos.filter(function(l){return l.categoria==="comissao";}).reduce(function(a,l){return a+Number(l.valor||0);},0);

  var h='<div class="cards-row" style="margin-bottom:16px">';
  h+='<div class="metric-card"><div class="metric-label">Total Comissões Pagas</div><div class="metric-value" style="color:var(--purple);font-size:16px">'+fmtCur(total)+'</div></div>';
  h+='<div class="metric-card"><div class="metric-label">Comissários Ativos</div><div class="metric-value" style="color:var(--purple)">'+Object.keys(porComissario).length+'</div></div>';
  h+='</div>';

  h+='<div class="section-card"><div class="section-header" style="background:var(--purple-bg)"><span class="section-title" style="color:var(--purple)">💼 Comissões por Comissário</span></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Comissário</th><th>Lançamentos</th><th>Total Pago</th></tr></thead><tbody>';
  Object.keys(porComissario).sort().forEach(function(c){var d=porComissario[c];h+='<tr><td><strong>'+escH(c)+'</strong></td><td>'+d.qtd+'</td><td><strong style="color:var(--purple)">'+fmtCur(d.total)+'</strong></td></tr>';});
  if(!Object.keys(porComissario).length)h+='<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:20px">Sem lançamentos de comissão</td></tr>';
  h+='</tbody></table></div></div>';

  // Por placa
  var porPlaca={};
  lancamentos.filter(function(l){return l.categoria==="comissao"&&l.placa;}).forEach(function(l){
    if(!porPlaca[l.placa])porPlaca[l.placa]={total:0,itens:[]};
    porPlaca[l.placa].total+=Number(l.valor||0);porPlaca[l.placa].itens.push(l);
  });
  if(Object.keys(porPlaca).length){
    h+='<div class="section-card" style="margin-top:0"><div class="section-header" style="background:var(--purple-bg)"><span class="section-title" style="color:var(--purple)">🚗 Comissões por Placa</span></div>';
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Placa</th><th>Total Comissões</th></tr></thead><tbody>';
    Object.keys(porPlaca).sort().forEach(function(p){h+='<tr><td><span class="badge badge-blue">'+escH(p)+'</span></td><td><strong>'+fmtCur(porPlaca[p].total)+'</strong></td></tr>';});
    h+='</tbody></table></div></div>';
  }
  return h;
}

function relDRE(){
  var h='<div class="section-card">';
  h+='<div class="section-header" style="background:var(--yellow-bg)"><span class="section-title" style="color:var(--yellow)">📋 DRE — Demonstrativo de Resultados</span>';
  h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
  h+='<input type="date" id="dreIni" value="'+dreInicio+'" onchange="dreInicio=this.value;render()" style="width:auto;min-width:130px">';
  h+='<span style="color:var(--text2);font-size:13px">até</span>';
  h+='<input type="date" id="dreFimI" value="'+dreFim+'" onchange="dreFim=this.value;render()" style="width:auto;min-width:130px">';
  h+='<button class="btn btn-secondary btn-sm" data-action="exportar-dre">⬇ CSV</button>';
  h+='</div></div>';

  var lFilt=lancamentos.filter(function(l){
    if(!dreInicio&&!dreFim)return true;
    if(dreInicio&&l.data<dreInicio)return false;
    if(dreFim&&l.data>dreFim)return false;
    return true;
  });
  var vFilt=vendas.filter(function(v){
    if(!dreInicio&&!dreFim)return v.statusVenda!=="Cancelada";
    var d=v.dataVenda||v.dataCriacao||"";
    if(dreInicio&&d<dreInicio)return false;
    if(dreFim&&d>dreFim)return false;
    return v.statusVenda!=="Cancelada";
  });

  var receitaVendas=vFilt.reduce(function(a,v){return a+Number(v.valorVenda||0);},0);
  var custoVendas=vFilt.reduce(function(a,v){return a+Number(v.valorCusto||0);},0);
  var margemBruta=receitaVendas-custoVendas;

  var despesasPorCat={};
  CATS_FIN.filter(function(c){return c.tipo==="despesa"&&CATS_DRE_EXCLUIR.indexOf(c.key)<0;}).forEach(function(c){
    var tot=lFilt.filter(function(l){return l.categoria===c.key;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    if(tot>0)despesasPorCat[c.key]={label:c.label,total:tot};
  });
  var totalDespesasOp=Object.values(despesasPorCat).reduce(function(a,d){return a+d.total;},0);
  var resultadoOp=margemBruta-totalDespesasOp;
  var cdbAjuste=lFilt.filter(function(l){return l.categoria==="saldo_cdb";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var resultadoFinal=resultadoOp+cdbAjuste;

  var rows=[];
  function addRow(label,val,cls,indent){rows.push({label:label,val:val,cls:cls||"",indent:indent||0});}

  addRow("RECEITAS","","dre-group");
  addRow("Receita de Vendas de Veículos",receitaVendas,"",1);
  addRow("(−) Custo dos Veículos Vendidos",-custoVendas,"dre-sub",1);
  addRow("= MARGEM BRUTA",margemBruta,margemBruta>=0?"dre-total":"dre-total-neg");

  addRow("DESPESAS OPERACIONAIS","","dre-group");
  Object.values(despesasPorCat).forEach(function(d){addRow("(−) "+d.label,-d.total,"dre-sub",1);});
  addRow("= RESULTADO OPERACIONAL",resultadoOp,resultadoOp>=0?"dre-total":"dre-total-neg");

  if(cdbAjuste!==0){
    addRow("OUTROS","","dre-group");
    addRow("Saldo CDB — Ajuste",cdbAjuste,"dre-sub",1);
  }
  addRow("= RESULTADO FINAL",resultadoFinal,resultadoFinal>=0?"dre-total":"dre-total-neg");

  h+='<div style="padding:16px">';
  if(!dreInicio&&!dreFim)h+='<div style="background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--yellow);margin-bottom:14px">⚠️ Selecione um período para filtrar o DRE</div>';
  rows.forEach(function(r){
    var indent=r.indent?'padding-left:'+(r.indent*20+14)+'px':' padding-left:14px';
    if(!r.val&&r.val!==0){
      h+='<div class="dre-row '+r.cls+'" style="'+indent+'"><span>'+escH(r.label)+'</span></div>';
    }else{
      var valStr=fmtCur(Math.abs(Number(r.val)));
      var cor=Number(r.val)>=0?"color:var(--green)":"color:var(--red)";
      h+='<div class="dre-row '+r.cls+'" style="'+indent+'"><span>'+escH(r.label)+'</span><span style="'+cor+'"><strong>'+valStr+'</strong></span></div>';
    }
  });
  h+='</div></div>';
  return h;
}

function exportarDRE(){
  var rows=[["Descrição","Valor"]];
  document.querySelectorAll(".dre-row").forEach(function(el){
    var cols=el.querySelectorAll("span");
    if(cols.length>=2)rows.push([cols[0].textContent.trim(),cols[1].textContent.trim()]);
    else if(cols.length===1)rows.push([cols[0].textContent.trim(),""]);
  });
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="dre_autohub.csv";a.click();URL.revokeObjectURL(url);
  notify("DRE exportado!");
}

function renderPosvenda(){
  var h='<div class="section-card"><div class="section-header"><span class="section-title">Pós-venda</span><button class="btn btn-primary" data-action="novo-pv">+ Nova Solicitação</button></div>';
  h+='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
  h+='<div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="pvSearch" placeholder="Cliente ou veículo..." value="'+escH(pvSearch)+'" oninput="pvSearch=this.value;render()"></div>';
  h+='<div class="filter-row">';
  ["Todos","Aberto","Em Atendimento","Resolvido","Cancelado"].forEach(function(s){h+='<button class="filter-tab'+(pvFiltro===s?" active":"")+'\" onclick="pvFiltro=\''+s+'\';render()">'+s+'</button>';});
  h+='</div></div>';
  var lista=posvenda.filter(function(p){
    var ok=pvFiltro==="Todos"||(p.statusPv===pvFiltro);
    if(pvSearch){var q=pvSearch.toLowerCase();ok=ok&&((p.cliente||"").toLowerCase().includes(q)||(p.veiculo||"").toLowerCase().includes(q));}
    return ok;
  });
  if(!lista.length){h+='<div class="empty-state">Nenhuma solicitação encontrada</div>';}
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Cliente</th><th>Veículo</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
    lista.forEach(function(p){
      var bc={Aberto:"badge-blue","Em Atendimento":"badge-purple",Resolvido:"badge-green",Cancelado:"badge-red"}[p.statusPv]||"badge-gray";
      h+='<tr><td>'+fmtDate(p.dataSolicitacao)+'</td><td><strong>'+escH(p.cliente||"-")+'</strong></td><td>'+escH(p.veiculo||"-")+'</td><td><span class="badge badge-orange">'+escH(p.tipoSolicitacao||"-")+'</span></td><td><span class="badge '+bc+'">'+escH(p.statusPv||"-")+'</span></td>';
      h+='<td><div style="display:flex;gap:4px"><button class="btn-icon" data-action="editar-pv" data-id="'+p.id+'" title="Editar">✏️</button><button class="btn-icon" data-action="excluir-pv" data-id="'+p.id+'" title="Excluir">🗑</button></div></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<div style="padding:10px 16px;color:var(--text3);font-size:12px">'+lista.length+' registro(s)</div></div>';
  return h;
}

function abrirModalPv(id){
  var p=id?(posvenda.find(function(x){return x.id===id;})||{}):{};
  var tipos=getTiposReclamacao();
  var h='<div class="form-grid">';
  h+='<div class="field"><label class="field-label">Data da Solicitação *</label><input type="date" id="pv_data" value="'+(p.dataSolicitacao||today())+'"></div>';
  h+='<div class="field"><label class="field-label">Status</label><select id="pv_status">'+STATUS_PV.map(function(s){return'<option value="'+s+'"'+(p.statusPv===s?" selected":"")+">"+s+"</option>";}).join("")+'</select></div>';
  h+='<div class="field"><label class="field-label">Cliente *</label><input id="pv_cliente" value="'+escH(p.cliente||"")+'" placeholder="Nome do cliente"></div>';
  h+='<div class="field"><label class="field-label">Veículo</label><input id="pv_veiculo" value="'+escH(p.veiculo||"")+'" placeholder="Placa ou modelo"></div>';
  h+='<div class="field"><label class="field-label">Tipo de Solicitação</label><select id="pv_tipo">'+tipos.map(function(s){return'<option value="'+escH(s)+'"'+(p.tipoSolicitacao===s?" selected":"")+">"+escH(s)+"</option>";}).join("")+'</select></div>';
  h+='<div class="field full"><label class="field-label">Descrição / Observações</label><textarea id="pv_obs">'+escH(p.obs||"")+'</textarea></div>';
  h+='</div>';
  showModal((id?"Editar Solicitação":"Nova Solicitação"),h,function(){salvarPv(id);},"modal");
}

function salvarPv(id){
  var cliente=(gv("pv_cliente")||"").trim();if(!cliente){notify("Preencha o cliente","err");return;}
  var data={cliente:cliente,veiculo:gv("pv_veiculo"),dataSolicitacao:gv("pv_data"),tipoSolicitacao:gv("pv_tipo"),statusPv:gv("pv_status"),obs:gv("pv_obs")};
  if(id){col("posvenda").doc(id).update(data).then(function(){notify("Atualizado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
  else{data.dataCriacao=today();col("posvenda").add(data).then(function(){notify("Cadastrado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});}
}
function excluirPv(id){confirmDlg("Excluir Solicitação","Tem certeza?",function(){col("posvenda").doc(id).delete().then(function(){notify("Excluído");}).catch(function(e){notify("Erro: "+e.message,"err");});});}

// ══════════════════════════════════
// CONFIGURAÇÕES
// ══════════════════════════════════
function renderConfiguracoes(){
  var vendedores=getVendedores();
  var comissarios=getComissarios();
  var tipos=getTiposReclamacao();

  function listaConfig(items,label,addAction,delAction){
    var h='<div class="section-card" style="margin-bottom:16px">';
    h+='<div class="section-header"><span class="section-title">'+label+'</span><button class="btn btn-primary btn-sm" data-action="'+addAction+'">+ Adicionar</button></div>';
    h+='<div style="padding:12px 16px">';
    if(!items.length){h+='<div style="color:var(--text3);font-size:13px;padding:8px 0">Nenhum cadastrado</div>';}
    items.forEach(function(item,i){
      h+='<div class="config-item"><span>'+escH(item)+'</span><button class="btn-icon btn-sm" data-action="'+delAction+'" data-idx="'+i+'" title="Remover">🗑</button></div>';
    });
    h+='</div></div>';
    return h;
  }

  var h=listaConfig(vendedores,"👤 Vendedores","add-vendedor","del-vendedor");
  h+=listaConfig(comissarios,"💼 Comissários","add-comissario","del-comissario");
  h+=listaConfig(tipos,"🔧 Tipos de Solicitação (Pós-venda)","add-tipo-pv","del-tipo-pv");
  return h;
}

function addVendedor(){
  showModal("Adicionar Vendedor",'<div class="field"><label class="field-label">Nome do Vendedor</label><input id="cfg_nome" placeholder="Ex: João Silva"></div>',function(){
    var nome=(gv("cfg_nome")||"").trim();if(!nome){notify("Digite o nome","err");return;}
    if(!config.vendedores)config.vendedores=[];
    if(config.vendedores.indexOf(nome)>=0){notify("Já cadastrado","err");return;}
    config.vendedores.push(nome);salvarConfig().then(function(){notify("Vendedor adicionado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});
  },"modal");
}
function delVendedor(idx){
  confirmDlg("Remover Vendedor","Tem certeza?",function(){
    if(config.vendedores)config.vendedores.splice(idx,1);salvarConfig().then(function(){notify("Removido");});
  });
}
function addComissario(){
  showModal("Adicionar Comissário",'<div class="field"><label class="field-label">Nome do Comissário</label><input id="cfg_nome" placeholder="Ex: Alex"></div>',function(){
    var nome=(gv("cfg_nome")||"").trim();if(!nome){notify("Digite o nome","err");return;}
    if(!config.comissarios)config.comissarios=[];
    if(config.comissarios.indexOf(nome)>=0){notify("Já cadastrado","err");return;}
    config.comissarios.push(nome);salvarConfig().then(function(){notify("Comissário adicionado!");closeModal();}).catch(function(e){notify("Erro: "+e.message,"err");});
  },"modal");
}
function delComissario(idx){
  confirmDlg("Remover Comissário","Tem certeza?",function(){
    if(config.comissarios)config.comissarios.splice(idx,1);salvarConfig().then(function(){notify("Removido");});
  });
}
function addTipoPv(){
  showModal("Adicionar Tipo de Solicitação",'<div class="field"><label class="field-label">Tipo</label><input id="cfg_nome" placeholder="Ex: Documentação Pendente"></div>',function(){
    var nome=(gv("cfg_nome")||"").trim();if(!nome){notify("Digite o tipo","err");return;}
    if(!config.tiposReclamacao)config.tiposReclamacao=["Reclamação","Dúvida","Documentação","Transferência","Revisão","Outro"];
    if(config.tiposReclamacao.indexOf(nome)>=0){notify("Já cadastrado","err");return;}

function delTipoPv(idx){
  confirmDlg("Remover Tipo","Tem certeza?",function(){
    if(config.tiposReclamacao)config.tiposReclamacao.splice(idx,1);salvarConfig().then(function(){notify("Removido");});

// ══════════════════════════════════
// USUÁRIOS
// ══════════════════════════════════
function renderUsuarios(){
  var isAdmin=usuarioLogado==="admin";
  var h='<div class="section-card"><div class="section-header"><span class="section-title">Minha Conta</span></div><div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" data-action="trocar-senha-me">🔒 Alterar Senha</button><button class="btn btn-danger" onclick="fazerLogout()">Sair</button></div></div>';
  if(!isAdmin)return h;
  h+='<div class="section-card" style="margin-top:16px"><div class="section-header"><span class="section-title">Gerenciar Usuários</span><button class="btn btn-primary" data-action="novo-usuario">+ Adicionar</button></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Usuário</th><th>Permissões</th><th>Ações</th></tr></thead><tbody>';
  Object.keys(USUARIOS).forEach(function(u){
    var perms=getUserPerms(u);
    var permLabel=perms===null?'<span class="badge badge-blue">Admin</span>':'<span class="badge badge-gray">'+perms.length+' abas</span>';
    h+='<tr><td><strong>'+escH(u)+'</strong></td><td>'+permLabel+'</td><td><div style="display:flex;gap:4px">';
    h+='<button class="btn btn-secondary btn-sm" data-action="trocar-senha" data-id="'+u+'">Senha</button>';
    if(u!=="admin"){h+='<button class="btn btn-secondary btn-sm" data-action="perm-user" data-id="'+u+'">Permissões</button><button class="btn btn-danger btn-sm" data-action="del-user" data-id="'+u+'">Remover</button>';}
    h+='</div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}
function novoUsuario(){
  showModal("Adicionar Usuário",'<div class="form-grid"><div class="field"><label class="field-label">Usuário</label><input id="nu_user" placeholder="Ex: operador1"></div><div class="field"><label class="field-label">Senha</label><input type="password" id="nu_pass"></div><div class="field full"><label class="field-label">Confirmar Senha</label><input type="password" id="nu_pass2"></div></div>',function(){
    var u=(gv("nu_user")||"").trim().toLowerCase();var p=gv("nu_pass");var p2=gv("nu_pass2");
    if(!u||u.length<3){notify("Mín. 3 caracteres","err");return;}
    if(USUARIOS[u]){notify("Já existe","err");return;}
    if(p.length<6){notify("Senha mín. 6 caracteres","err");return;}
    if(p!==p2){notify("Senhas não conferem","err");return;}
    USUARIOS[u]=p;salvarUsuarios();notify("Usuário criado!");closeModal();render();
  },"modal");
}
function trocarSenha(user){
  var isMe=user===usuarioLogado;
  var h='<div class="form-grid">'+(isMe?'<div class="field full"><label class="field-label">Senha Atual</label><input type="password" id="ap_atual"></div>':"")+
    '<div class="field full"><label class="field-label">Nova Senha</label><input type="password" id="ap_nova"></div><div class="field full"><label class="field-label">Confirmar</label><input type="password" id="ap_conf"></div></div>';
  showModal("Alterar Senha — "+user,h,function(){
    if(isMe&&gv("ap_atual")!==USUARIOS[user]){notify("Senha atual incorreta","err");return;}
    var n=gv("ap_nova");if(n.length<6){notify("Mín. 6 caracteres","err");return;}if(n!==gv("ap_conf")){notify("Senhas não conferem","err");return;}
    USUARIOS[user]=n;salvarUsuarios();notify("Senha alterada!");closeModal();
  },"modal");
}
function permUser(user){
  var perms=PERMISSOES_USUARIOS[user]||PERMISSOES_PADRAO.slice();
  var abas=TABS.filter(function(t){return t.id!=="usuarios";});
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  abas.forEach(function(t){var checked=perms.indexOf(t.id)>=0;h+='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px"><input type="checkbox" id="perm_'+t.id+'"'+(checked?" checked":"")+'>'+t.ico+' '+t.label+'</label>';});
  h+='</div>';
  showModal("Permissões — "+user,h,function(){
    var novas=abas.filter(function(t){var el=document.getElementById("perm_"+t.id);return el&&el.checked;}).map(function(t){return t.id;});
    PERMISSOES_USUARIOS[user]=novas;salvarPermissoes();notify("Permissões atualizadas!");closeModal();render();
  },"modal");
}
function delUser(user){
  if(user==="admin"||user===usuarioLogado){notify("Não é possível remover","err");return;}
  confirmDlg("Remover Usuário","Deseja remover \""+user+"\"?",function(){delete USUARIOS[user];salvarUsuarios();notify("Removido");render();});
}

// ══ MODAL ══
function showModal(title,body,saveFn,type){
  var ov=document.createElement("div");ov.className="overlay";ov.id="modalOverlay";
  var m=document.createElement("div");m.className="modal"+(type==="modal-lg"?" modal-lg":"");
  var footer=saveFn?'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="modalSaveBtn">Salvar</button></div>':'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Fechar</button></div>';
  m.innerHTML='<div class="modal-header"><span class="modal-title">'+title+'</span><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">'+body+'</div>'+footer;
  ov.appendChild(m);ov.onclick=function(e){if(e.target===ov)closeModal();};document.body.appendChild(ov);
  if(saveFn)document.getElementById("modalSaveBtn").onclick=saveFn;
}
function closeModal(){var ov=document.getElementById("modalOverlay");if(ov)ov.remove();}
function confirmDlg(title,msg,fn){
  var ov=document.createElement("div");ov.className="confirm-overlay";ov.id="confirmOverlay";
  var b=document.createElement("div");b.className="confirm-box";
  b.innerHTML='<div style="font-size:28px;margin-bottom:10px">⚠️</div><h3 style="margin-bottom:8px">'+title+'</h3><p style="color:var(--text2);font-size:13px;margin-bottom:20px">'+msg+'</p><div style="display:flex;gap:8px;justify-content:center"></div>';
  var btnC=document.createElement("button");btnC.className="btn btn-secondary";btnC.textContent="Cancelar";btnC.onclick=function(){ov.remove();};
  var btnO=document.createElement("button");btnO.className="btn btn-danger";btnO.textContent="Confirmar";btnO.onclick=function(){ov.remove();fn();};
  b.querySelector("div:last-child").appendChild(btnC);b.querySelector("div:last-child").appendChild(btnO);
  ov.appendChild(b);document.body.appendChild(ov);
}

// ══ EVENTS ══
function bindActions(){
  document.getElementById("content").onclick=function(e){
    var el=e.target.closest("[data-action]");if(!el)return;
    var a=el.getAttribute("data-action"),id=el.getAttribute("data-id"),idx=parseInt(el.getAttribute("data-idx"));
    if(a==="nova-venda")abrirModalVenda(null);
    else if(a==="editar-venda")abrirModalVenda(id);
    else if(a==="ver-venda")verVenda(id);
    else if(a==="excluir-venda")excluirVenda(id);
    else if(a==="novo-lancamento")abrirModalLancamento(null);
    else if(a==="editar-lancamento")abrirModalLancamento(id);
    else if(a==="excluir-lancamento")excluirLancamento(id);
    else if(a==="novo-pv")abrirModalPv(null);
    else if(a==="editar-pv")abrirModalPv(id);
    else if(a==="excluir-pv")excluirPv(id);
    else if(a==="exportar-dre")exportarDRE();
    else if(a==="add-vendedor")addVendedor();
    else if(a==="del-vendedor")delVendedor(idx);
    else if(a==="add-comissario")addComissario();
    else if(a==="del-comissario")delComissario(idx);
    else if(a==="add-tipo-pv")addTipoPv();
    else if(a==="del-tipo-pv")delTipoPv(idx);
    else if(a==="novo-usuario")novoUsuario();
    else if(a==="trocar-senha")trocarSenha(id);
    else if(a==="trocar-senha-me")trocarSenha(usuarioLogado);
    else if(a==="perm-user")permUser(id);
    else if(a==="del-user")delUser(id);
  };
}
